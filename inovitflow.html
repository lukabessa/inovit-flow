// Início da semana = segunda-feira (padrão BR)
function semanaIni(d){
  const dow=d.getDay(); // 0=Dom,1=Seg...
  const diff=dow===0?-6:1-dow;
  return addDays(d,diff);
}

function isCurrentPeriod(meta){
  const cr=new Date(meta.criadoEm);
  const td=today();
  if(meta.periodo==='dia') return toYMD(cr)===toYMD(td);
  if(meta.periodo==='semana'){
    const ini=semanaIni(td);
    const fim=addDays(ini,6);
    return cr>=ini&&cr<=new Date(fim.getFullYear(),fim.getMonth(),fim.getDate(),23,59,59);
  }
  if(meta.periodo==='mes') return cr.getFullYear()===td.getFullYear()&&cr.getMonth()===td.getMonth();
  return true;
}

function fmtPeriodoLabel(meta){
  const d=new Date(meta.criadoEm);
  if(meta.periodo==='dia') return `${d.getDate().toString().padStart(2,'0')}/${(d.getMonth()+1).toString().padStart(2,'0')}/${d.getFullYear()}`;
  if(meta.periodo==='semana'){
    const ini=semanaIni(d);
    const fim=addDays(ini,6);
    return `Semana ${ini.getDate().toString().padStart(2,'0')}/${(ini.getMonth()+1).toString().padStart(2,'0')} – ${fim.getDate().toString().padStart(2,'0')}/${(fim.getMonth()+1).toString().padStart(2,'0')}`;
  }
  if(meta.periodo==='mes') return `${MESES[d.getMonth()]} ${d.getFullYear()}`;
  return '';
}

function fmtPeriodoKey(meta){
  const d=new Date(meta.criadoEm);
  if(meta.periodo==='dia') return toYMD(d);
  if(meta.periodo==='semana'){
    const ini=semanaIni(d);
    return `w_${toYMD(ini)}`;
  }
  if(meta.periodo==='mes') return `m_${d.getFullYear()}_${d.getMonth()}`;
  return 'outro';
}

function HistoricoMetas({metas,onToggle,onDelete,onEdit,onUpdateQtd}){
  const [aberto,setAberto]=useState(true);
  const [expandidos,setExpandidos]=useState({});

  const passadas=metas.filter(m=>!isCurrentPeriod(m))
    .sort((a,b)=>new Date(b.criadoEm)-new Date(a.criadoEm));

  if(passadas.length===0) return null;

  // agrupar por período
  const grupos={};
  passadas.forEach(m=>{
    const key=fmtPeriodoKey(m);
    if(!grupos[key]) grupos[key]={label:fmtPeriodoLabel(m),metas:[],key};
    grupos[key].metas.push(m);
  });
  const gruposList=Object.values(grupos);

  const totalHist=passadas.length;
  const feitasHist=passadas.filter(m=>m.concluido).length;

  return(
    <div style={{marginTop:20,borderTop:'1px solid var(--border)',paddingTop:16}}>
      {/* Header do histórico */}
      <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:aberto?14:0,cursor:'pointer'}} onClick={()=>setAberto(p=>!p)}>
        <div style={{display:'flex',alignItems:'center',gap:8,flex:1}}>
          <Ic.Clock s={15} c='var(--t2)'/>
          <span style={{fontFamily:'Syne',fontWeight:700,fontSize:14,color:'var(--t2)'}}>Histórico de Metas</span>
          <span className="badge" style={{background:'rgba(255,255,255,.06)',color:'var(--t3)',fontSize:10}}>{totalHist} metas · {feitasHist} concluídas</span>
        </div>
        <div style={{color:'var(--t3)',fontSize:12,display:'flex',alignItems:'center',gap:5}}>
          {aberto?<Ic.ChevL s={14}/>:<Ic.ChevR s={14}/>}
          <span style={{fontSize:11}}>{aberto?'Recolher':'Expandir'}</span>
        </div>
      </div>

      {aberto&&(
        <div style={{display:'flex',flexDirection:'column',gap:10}}>
          {gruposList.map(grupo=>{
            const exp=expandidos[grupo.key]!==false; // aberto por padrão
            const feitas=grupo.metas.filter(m=>m.concluido).length;
            const pct=grupo.metas.length>0?Math.round((feitas/grupo.metas.length)*100):0;
            return(
              <div key={grupo.key} style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:13,overflow:'hidden'}}>
                {/* grupo header */}
                <div style={{padding:'12px 16px',display:'flex',alignItems:'center',gap:10,cursor:'pointer',borderBottom:exp?'1px solid var(--border)':'none'}}
                  onClick={()=>setExpandidos(p=>({...p,[grupo.key]:!exp}))}>
                  <div style={{flex:1,display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}>
                    <span style={{fontWeight:600,fontSize:13}}>{grupo.label}</span>
                    <span style={{fontSize:11,color:'var(--t3)'}}>{grupo.metas.length} meta{grupo.metas.length!==1?'s':''}</span>
                    <div style={{display:'flex',alignItems:'center',gap:6}}>
                      <div style={{width:60,height:4,background:'var(--surf3)',borderRadius:99,overflow:'hidden'}}>
                        <div style={{height:'100%',width:`${pct}%`,background:pct===100?'var(--green)':pct>=50?'var(--amber)':'var(--t3)',borderRadius:99}}/>
                      </div>
                      <span style={{fontSize:10,color:pct===100?'var(--green)':pct>=50?'var(--amber)':'var(--t3)',fontWeight:600}}>{pct}%</span>
                    </div>
                  </div>
                  <div style={{color:'var(--t3)',fontSize:11,display:'flex',alignItems:'center',gap:3}}>
                    {exp?<Ic.ChevL s={12}/>:<Ic.ChevR s={12}/>}
                  </div>
                </div>
                {/* grupo metas */}
                {exp&&(
                  <div style={{padding:'10px 16px'}}>
                    {grupo.metas.map(m=>(
                      <MetaItem key={m.id} meta={m} onToggle={onToggle} onDelete={onDelete} onEdit={onEdit} onUpdateQtd={onUpdateQtd}/>
                    ))}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function MetasTab({metas,onSaveMetas}){
  const [editMeta,setEditMeta]=useState(null);
  const [showNova,setShowNova]=useState(false);
  const [filtroCat,setFiltroCat]=useState('todas');

  const handleAdd=(nova)=>{onSaveMetas([nova,...metas]);};
  const handleToggle=(id)=>{
    onSaveMetas(metas.map(m=>m.id===id?{...m,concluido:!m.concluido,concluidoEm:!m.concluido?new Date().toISOString():null}:m));
  };
  const handleDelete=(id)=>{if(!confirm('Excluir esta meta?'))return;onSaveMetas(metas.filter(m=>m.id!==id));};
  const handleEdit=(meta)=>setEditMeta(meta);
  const handleSaveEdit=(meta)=>{onSaveMetas(metas.map(m=>m.id===meta.id?meta:m));setEditMeta(null);};
  const handleUpdateQtd=(id,delta)=>{
    onSaveMetas(metas.map(m=>{
      if(m.id!==id)return m;
      const novoAtual=Math.max(0,Math.min((m.atual||0)+delta,m.metaQtd));
      const concluido=novoAtual>=m.metaQtd;
      return {...m,atual:novoAtual,concluido,concluidoEm:concluido&&!m.concluido?new Date().toISOString():m.concluidoEm};
    }));
  };

  const metasAtuais=metas.filter(isCurrentPeriod);
  const metasFiltradas=filtroCat==='todas'?metasAtuais:metasAtuais.filter(m=>(m.categoria||'pessoal')===filtroCat);
  const total=metasFiltradas.length;
  const feitas=metasFiltradas.filter(m=>m.concluido).length;
  const pctGeral=total>0?Math.round((feitas/total)*100):0;

  const countPessoal=metasAtuais.filter(m=>(m.categoria||'pessoal')==='pessoal').length;
  const countTrabalho=metasAtuais.filter(m=>m.categoria==='trabalho').length;

  const sections=[
    {periodo:'dia',titulo:'Hoje',cor:'#22C55E',icone:<Ic.Sun s={14} c='#22C55E'/>},
    {periodo:'semana',titulo:'Esta Semana',cor:'#F59E0B',icone:<Ic.Calendar s={14} c='#F59E0B'/>},
    {periodo:'mes',titulo:'Este Mês',cor:'#4ADE80',icone:<Ic.Flag s={14} c='#4ADE80'/>},
  ];

  return(
    <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}} className="fade-in">
      {/* Header */}
      <div style={{padding:'14px 24px',borderBottom:'1px solid var(--border)',flexShrink:0,display:'flex',alignItems:'center',gap:16,flexWrap:'wrap'}}>
        <div>
          <div style={{fontFamily:'Syne',fontWeight:700,fontSize:18}}>Metas & Objetivos</div>
          <div style={{fontSize:12,color:'var(--t2)',marginTop:2}}>Metas pessoais e de trabalho — do dia, semana e mês</div>
        </div>
        <div style={{marginLeft:'auto',display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}>
          {total>0&&(
            <div style={{display:'flex',alignItems:'center',gap:10}}>
              <div style={{textAlign:'right'}}>
                <div style={{fontSize:11,color:'var(--t2)'}}>Progresso atual</div>
                <div style={{fontFamily:'Syne',fontWeight:800,fontSize:20,color:'var(--accent)'}}>{pctGeral}%</div>
              </div>
              <div style={{width:84}}>
                <div style={{fontSize:10,color:'var(--t3)',marginBottom:3}}>{feitas}/{total} concluídas</div>
                <div className="progress-bar" style={{height:7}}>
                  <div className="progress-fill" style={{width:`${pctGeral}%`,background:'var(--accent)'}}/>
                </div>
              </div>
            </div>
          )}
          <button className="btn btn-primary" style={{gap:6,paddingLeft:12,paddingRight:14}} onClick={()=>setShowNova(true)}>
            <Ic.Plus s={14}/> Nova Meta
          </button>
        </div>
      </div>

      {/* Filtros de categoria */}
      <div style={{padding:'10px 24px',borderBottom:'1px solid var(--border)',flexShrink:0,display:'flex',alignItems:'center',gap:8}}>
        <button onClick={()=>setFiltroCat('todas')}
          className={`meta-cat-tab${filtroCat==='todas'?' active-todas':''}`}>
          Todas {metasAtuais.length>0&&<span style={{opacity:.7,fontSize:10}}>({metasAtuais.length})</span>}
        </button>
        <button onClick={()=>setFiltroCat('pessoal')}
          className={`meta-cat-tab${filtroCat==='pessoal'?' active-pessoal':''}`}>
          👤 Pessoal {countPessoal>0&&<span style={{opacity:.7,fontSize:10}}>({countPessoal})</span>}
        </button>
        <button onClick={()=>setFiltroCat('trabalho')}
          className={`meta-cat-tab${filtroCat==='trabalho'?' active-trabalho':''}`}>
          💼 Trabalho {countTrabalho>0&&<span style={{opacity:.7,fontSize:10}}>({countTrabalho})</span>}
        </button>
      </div>

      {/* Scroll area */}
      <div style={{flex:1,overflow:'auto',padding:'16px 24px'}}>
        {/* Colunas atuais */}
        <div className="metas-cols">
          {sections.map(sec=>(
            <MetaSection key={sec.periodo}
              titulo={sec.titulo} cor={sec.cor} icone={sec.icone}
              periodo={sec.periodo} metas={metasFiltradas}
              onAdd={handleAdd} onToggle={handleToggle}
              onDelete={handleDelete} onEdit={handleEdit}
              onUpdateQtd={handleUpdateQtd}
            />
          ))}
        </div>

        {/* Histórico de períodos anteriores */}
        <HistoricoMetas
          metas={filtroCat==='todas'?metas:metas.filter(m=>(m.categoria||'pessoal')===filtroCat)}
          onToggle={handleToggle}
          onDelete={handleDelete}
          onEdit={handleEdit}
          onUpdateQtd={handleUpdateQtd}
        />
      </div>

      {showNova&&(
        <NovaMetaModal
          onSave={handleAdd}
          onClose={()=>setShowNova(false)}
          defaultCategoria={filtroCat==='todas'?'pessoal':filtroCat}
        />
      )}
      {editMeta&&(
        <EditMetaModal meta={editMeta} onSave={handleSaveEdit} onClose={()=>setEditMeta(null)}/>
      )}
    </div>
  );
}

function GoogleSection({gg}){
  const [cid,setCid]=useState(GG.clientId());
  const [connecting,setConnecting]=useState(false);

  const handleConnect=async()=>{
    if(!cid.trim())return;
    GG.saveCid(cid.trim());
    setConnecting(true);
    await gg.connect();
    setConnecting(false);
  };

  const handleDisconnect=()=>{
    if(!confirm('Desconectar do Google Agenda? Os eventos importados do Google serão removidos da agenda local.'))return;
    gg.disconnect();
  };

  return(
    <div className="perfil-section fade-in">
      <div className="perfil-section-title">
        <Ic.Google s={16}/> Google Agenda
      </div>

      {gg.connected?(
        <>
          {/* Status conectado */}
          <div style={{display:'flex',alignItems:'center',gap:10,background:'rgba(34,197,94,.08)',border:'1px solid rgba(34,197,94,.2)',borderRadius:12,padding:'12px 16px',marginBottom:14}}>
            <Ic.CheckCircle s={18} c='var(--accent)'/>
            <div style={{flex:1}}>
              <div style={{fontSize:13,fontWeight:600}}>Conectado ao Google Agenda</div>
              {gg.lastSync&&<div style={{fontSize:11,color:'var(--t2)',marginTop:2}}>
                Última sync: {gg.lastSync.toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}
              </div>}
            </div>
          </div>

          {gg.error&&(
            <div style={{display:'flex',alignItems:'center',gap:7,marginBottom:12,color:'var(--red)',fontSize:12,background:'rgba(239,68,68,.08)',border:'1px solid rgba(239,68,68,.18)',borderRadius:9,padding:'9px 12px'}}>
              <Ic.AlertTriangle s={13} c='var(--red)'/> {gg.error}
            </div>
          )}

          <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:14}}>
            <button className="btn btn-primary btn-sm" onClick={gg.sync} disabled={gg.syncing} style={{gap:6}}>
              <Ic.Refresh s={13} c='#000' spin={gg.syncing}/>
              {gg.syncing?'Sincronizando...':'Sincronizar agora'}
            </button>
            <button className="btn btn-ghost btn-sm" onClick={handleDisconnect} style={{color:'var(--t3)'}}>
              Desconectar

          <div style={{fontSize:11,color:'var(--t3)',lineHeight:1.7,background:'var(--surf2)',borderRadius:10,padding:'10px 14px',border:'1px solid var(--border)'}}>
            ✓ Eventos criados aqui são enviados ao Google automaticamente<br/>
            ✓ Eventos do Google aparecem na agenda ao sincronizar<br/>
            ✓ Exclusões são refletidas nos dois lados
          </div>
        </>
      ):(
        <>
          <div style={{fontSize:12,color:'var(--t2)',lineHeight:1.7,marginBottom:16}}>
            Conecte o Google Agenda para sincronizar eventos nos dois sentidos. Você precisará de um <strong style={{color:'var(--t1)'}}>Client ID</strong> do Google Cloud Console (gratuito).
          </div>

          <div className="field">
            <label>Google OAuth Client ID</label>
            <input value={cid} onChange={e=>setCid(e.target.value)} placeholder="XXXXXXXX.apps.googleusercontent.com" style={{fontFamily:'monospace',fontSize:12}}/>
          </div>

          {gg.error&&(
            <div style={{display:'flex',alignItems:'center',gap:7,marginBottom:12,color:'var(--red)',fontSize:12,background:'rgba(239,68,68,.08)',border:'1px solid rgba(239,68,68,.18)',borderRadius:9,padding:'9px 12px'}}>
              <Ic.AlertTriangle s={13} c='var(--red)'/> {gg.error}

          <button className="btn btn-primary btn-sm" onClick={handleConnect} disabled={!cid.trim()||connecting} style={{marginBottom:20,gap:6}}>
            <Ic.Google s={14}/> {connecting?'Aguardando login...':'Conectar Google Agenda'}

          {/* Passo a passo */}
          <div style={{background:'var(--surf2)',border:'1px solid var(--border)',borderRadius:13,padding:16}}>
            <div style={{fontWeight:700,fontSize:12,marginBottom:12,color:'var(--t1)',display:'flex',alignItems:'center',gap:7}}>
              <Ic.Info s={13} c='var(--accent)'/> Como obter o Client ID (5 min, gratuito)
            </div>
            {[
              ['1','Acesse o Google Cloud Console','console.cloud.google.com'],
              ['2','Crie um projeto ou selecione um existente',''],
              ['3','Vá em "APIs e Serviços" → "Biblioteca" → ative a "Google Calendar API"',''],
              ['4','Vá em "Credenciais" → "Criar credenciais" → "ID do cliente OAuth 2.0"',''],
              ['5','Tipo: Aplicativo da Web. Em "Origens JavaScript autorizadas" adicione sua URL (ex: http://localhost:3333)',''],

              </div>
            ))}

function compressImage(file,maxPx=260,quality=0.82){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const scale=Math.min(1,maxPx/Math.max(img.width,img.height));
        const w=Math.round(img.width*scale),h=Math.round(img.height*scale);
        const canvas=document.createElement('canvas');
        canvas.width=w;canvas.height=h;
        const ctx=canvas.getContext('2d');
        ctx.drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg',quality));
      };
      img.onerror=reject;
      img.src=e.target.result;
    };
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

function PerfilTab({session,onUpdateSession,onLogout,userPhoto,onUpdatePhoto,gg}){
  const [secao,setSecao]=useState('info');
  const getUser=()=>authStore.users().find(u=>u.id===session.userId)||{};
  const [user,setUserData]=useState(getUser);
  const [uploading,setUploading]=useState(false);
  const fileRef=useRef();

  // info pessoal
  const [nome,setNome]=useState(user.nome||'');
  const [bio,setBio]=useState(user.bio||'');
  const [infoOk,setInfoOk]=useState(false);

  // alterar login
  const [novoLogin,setNovoLogin]=useState(user.username||'');
  const [senhaParaLogin,setSenhaParaLogin]=useState('');
  const [loginMsg,setLoginMsg]=useState({err:'',ok:''});
  const [showSenhaLogin,setShowSenhaLogin]=useState(false);

  // alterar senha
  const [senhaAtual,setSenhaAtual]=useState('');
  const [novaSenha,setNovaSenha]=useState('');
  const [confSenha,setConfSenha]=useState('');
  const [showPw,setShowPw]=useState({a:false,n:false,c:false});
  const [senhaMsg,setSenhaMsg]=useState({err:'',ok:''});

  const initials=(user.nome||user.username||'??').slice(0,2).toUpperCase();
  const criadoEm=user.criadoEm?new Date(user.criadoEm):null;

  const handlePhotoSelect=async(e)=>{
    const file=e.target.files?.[0];
    if(!file)return;
    if(!file.type.startsWith('image/'))return alert('Selecione uma imagem (JPG, PNG, WEBP...).');
    setUploading(true);
    try{
      const compressed=await compressImage(file);
      onUpdatePhoto(compressed);
    }catch(err){alert('Erro ao processar imagem.');}
    finally{setUploading(false);if(fileRef.current)fileRef.current.value='';}
  };

  const handleRemovePhoto=()=>{
    if(!confirm('Remover foto de perfil?'))return;
    onUpdatePhoto(null);
  };

  const updateUser=(changes)=>{
    const users=authStore.users();
    const updated=users.map(u=>u.id===session.userId?{...u,...changes}:u);
    authStore.saveUsers(updated);
    setUserData(p=>({...p,...changes}));
  };

  const handleSaveInfo=()=>{
    updateUser({nome:nome.trim(),bio:bio.trim()});
    const newSess={...session,nome:nome.trim()};
    authStore.saveSession(newSess);
    onUpdateSession(newSess);
    setInfoOk(true);
    setTimeout(()=>setInfoOk(false),2500);
  };

  const handleSaveLogin=()=>{
    setLoginMsg({err:'',ok:''});
    const novoTrimmed=novoLogin.trim();
    if(!novoTrimmed)return setLoginMsg({err:'Informe o novo nome de usuário.',ok:''});
    const cur=authStore.users().find(u=>u.id===session.userId);
    if(!cur||cur.password!==senhaParaLogin)return setLoginMsg({err:'Senha incorreta.',ok:''});
    const existe=authStore.users().find(u=>u.id!==session.userId&&u.username.toLowerCase()===novoTrimmed.toLowerCase());
    if(existe)return setLoginMsg({err:'Este nome já está em uso.',ok:''});
    updateUser({username:novoTrimmed});
    const newSess={...session,username:novoTrimmed};
    authStore.saveSession(newSess);
    onUpdateSession(newSess);
    setSenhaParaLogin('');
    setLoginMsg({err:'',ok:'Login atualizado com sucesso!'});
    setTimeout(()=>setLoginMsg({err:'',ok:''}),3000);
  };

  const handleSaveSenha=()=>{
    setSenhaMsg({err:'',ok:''});
    if(!senhaAtual||!novaSenha||!confSenha)return setSenhaMsg({err:'Preencha todos os campos.',ok:''});
    const cur=authStore.users().find(u=>u.id===session.userId);
    if(!cur||cur.password!==senhaAtual)return setSenhaMsg({err:'Senha atual incorreta.',ok:''});
    if(novaSenha.length<4)return setSenhaMsg({err:'Mínimo 4 caracteres.',ok:''});
    if(novaSenha!==confSenha)return setSenhaMsg({err:'Senhas não coincidem.',ok:''});
    updateUser({password:novaSenha});
    setSenhaAtual('');setNovaSenha('');setConfSenha('');
    setSenhaMsg({err:'',ok:'Senha alterada com sucesso!'});
    setTimeout(()=>setSenhaMsg({err:'',ok:''}),3000);
  };

  const handleDeleteAccount=()=>{
    if(!confirm('Tem certeza que deseja excluir sua conta?\nTodos os seus dados serão apagados permanentemente.'))return;
    const conf=prompt('Para confirmar, digite  EXCLUIR  (em maiúsculas):');
    if(conf!=='EXCLUIR'){alert('Confirmação incorreta. Conta mantida.');return;}
    const users=authStore.users().filter(u=>u.id!==session.userId);
    authStore.saveUsers(users);
    ['ev','pl','pin','mt'].forEach(k=>localStorage.removeItem(`if_${k}_${session.userId}`));
    onLogout();
  };

  const PwField=({label,value,onChange,show,onToggle,placeholder})=>(
    <div className="field">
      <label>{label}</label>
      <div className="pw-wrap">
        <input type={show?'text':'password'} value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder||'••••••••'}/>
        <button className="pw-eye" type="button" onClick={onToggle}>{show?<Ic.EyeOff s={14}/>:<Ic.Eye s={14}/>}</button>
      </div>
    </div>
  );

  const TABS=[
    {id:'info',label:'Informações',icon:<Ic.User s={13}/>},
    {id:'login',label:'Login',icon:<Ic.AtSign s={13}/>},
    {id:'senha',label:'Senha',icon:<Ic.Key s={13}/>},
    {id:'google',label:'Google',icon:<Ic.Google s={13}/>},
  ];

  return(
    <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}} className="fade-in">
      {/* Topbar extra */}
      <div style={{padding:'14px 24px',borderBottom:'1px solid var(--border)',flexShrink:0}}>
        <div style={{fontFamily:'Syne',fontWeight:700,fontSize:18}}>Meu Perfil</div>
        <div style={{fontSize:12,color:'var(--t2)',marginTop:2}}>Gerencie suas informações e configurações de acesso</div>
      </div>

      <div className="perfil-wrap">
        {/* Hidden file input */}
        <input ref={fileRef} type="file" accept="image/*" style={{display:'none'}} onChange={handlePhotoSelect}/>

        {/* Hero / Avatar */}
        <div className="perfil-hero">
          <div className="avatar-upload-wrap" onClick={()=>fileRef.current?.click()} title="Alterar foto">
            {userPhoto
              ? <img src={userPhoto} className="perfil-avatar-photo" alt="Foto de perfil"/>
              : <div className="perfil-avatar-big">{uploading?'..':initials}</div>
            }
            <div className="avatar-overlay">
              <Ic.Camera s={18} c='#fff'/>
              <span>{userPhoto?'Alterar':'Adicionar'}</span>
            </div>
          </div>
          <div style={{flex:1}}>
            <div style={{fontFamily:'Syne',fontWeight:800,fontSize:20,marginBottom:3}}>{user.nome||user.username}</div>
            {user.nome&&<div style={{fontSize:13,color:'var(--t2)',marginBottom:4}}>@{user.username}</div>}
            {user.bio&&<div style={{fontSize:12,color:'var(--t3)',lineHeight:1.5}}>{user.bio}</div>}
            <div style={{display:'flex',gap:8,marginTop:10,flexWrap:'wrap',alignItems:'center'}}>
              {criadoEm&&(
                <span style={{fontSize:11,color:'var(--t3)',display:'flex',alignItems:'center',gap:4,background:'var(--surf2)',border:'1px solid var(--border)',borderRadius:7,padding:'3px 9px'}}>
                  <Ic.Calendar s={11} c='var(--t3)'/> Desde {criadoEm.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}
                </span>
              )}
              <span style={{fontSize:11,color:'var(--accent)',display:'flex',alignItems:'center',gap:4,background:'rgba(34,197,94,.08)',border:'1px solid rgba(34,197,94,.18)',borderRadius:7,padding:'3px 9px'}}>
                <Ic.Shield s={11} c='var(--accent)'/> Conta ativa
              </span>
              <button className="btn btn-ghost btn-xs" onClick={()=>fileRef.current?.click()} style={{fontSize:11,gap:4}}>
                <Ic.Camera s={12}/> {userPhoto?'Alterar foto':'Adicionar foto'}
              </button>
              {userPhoto&&(
                <button className="btn btn-xs" onClick={handleRemovePhoto}
                  style={{fontSize:11,gap:4,color:'var(--t3)',border:'1px solid var(--border2)',background:'transparent'}}>
                  <Ic.ImageOff s={12}/> Remover
                </button>
              )}
            </div>
          </div>
        </div>

        {/* Tabs */}
        <div className="perfil-tabs">
          {TABS.map(t=>(
            <div key={t.id} className={`perfil-tab ${secao===t.id?'active':''}`} onClick={()=>setSecao(t.id)}>
              {t.icon}{t.label}
            </div>
          ))}
        </div>

        {/* ── Seção: Info ── */}
        {secao==='info'&&(
          <div className="perfil-section fade-in">
            <div className="perfil-section-title"><Ic.User s={15} c='var(--accent)'/> Informações Pessoais</div>
            <div className="field">
              <label>Nome completo</label>
              <input value={nome} onChange={e=>setNome(e.target.value)} placeholder="Seu nome completo..."/>
            </div>
            <div className="field">
              <label>Bio / Descrição</label>
              <textarea rows={3} value={bio} onChange={e=>setBio(e.target.value)} placeholder="Uma frase sobre você (opcional)..."/>
            </div>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:10,marginTop:6}}>
              <div>
                {infoOk&&(
                  <div className="perfil-msg-ok"><Ic.Check s={13} c='var(--green)'/> Informações salvas!</div>
                )}
              </div>
              <button className="btn btn-primary" onClick={handleSaveInfo}>
                <Ic.Check s={14}/> Salvar informações
              </button>
            </div>
          </div>
        )}

        {/* ── Seção: Login ── */}
        {secao==='login'&&(
          <div className="perfil-section fade-in">
            <div className="perfil-section-title"><Ic.AtSign s={15} c='var(--accent)'/> Alterar Nome de Login</div>
            <div style={{fontSize:12,color:'var(--t2)',background:'var(--surf2)',borderRadius:9,padding:'10px 14px',marginBottom:16,border:'1px solid var(--border)',display:'flex',alignItems:'flex-start',gap:8}}>
              <Ic.Info s={14} c='var(--t2)'/> Login atual: <strong style={{color:'var(--t1)'}}>{user.username}</strong>
            </div>
            <div className="field">
              <label>Novo nome de usuário</label>
              <input value={novoLogin} onChange={e=>setNovoLogin(e.target.value)} placeholder="Novo login..."/>
            </div>
            <PwField
              label="Confirme sua senha atual"
              value={senhaParaLogin}
              onChange={setSenhaParaLogin}
              show={showSenhaLogin}
              onToggle={()=>setShowSenhaLogin(p=>!p)}
              placeholder="Senha para confirmar"
            />
            {loginMsg.err&&<div className="perfil-msg-err"><Ic.AlertTriangle s={13} c='var(--red)'/> {loginMsg.err}</div>}
            {loginMsg.ok&&<div className="perfil-msg-ok"><Ic.Check s={13} c='var(--green)'/> {loginMsg.ok}</div>}
            <div style={{display:'flex',justifyContent:'flex-end',marginTop:16}}>
              <button className="btn btn-primary" onClick={handleSaveLogin}>
                <Ic.Check s={14}/> Atualizar login
              </button>
            </div>
          </div>
        )}

        {/* ── Seção: Senha ── */}
        {secao==='senha'&&(
          <div className="perfil-section fade-in">
            <div className="perfil-section-title"><Ic.Key s={15} c='var(--accent)'/> Alterar Senha</div>
            <PwField label="Senha atual" value={senhaAtual} onChange={setSenhaAtual} show={showPw.a} onToggle={()=>setShowPw(p=>({...p,a:!p.a}))}/>
            <PwField label="Nova senha" value={novaSenha} onChange={setNovaSenha} show={showPw.n} onToggle={()=>setShowPw(p=>({...p,n:!p.n}))} placeholder="Mínimo 4 caracteres"/>
            <PwField label="Confirmar nova senha" value={confSenha} onChange={setConfSenha} show={showPw.c} onToggle={()=>setShowPw(p=>({...p,c:!p.c}))} placeholder="Repita a nova senha"/>
            {/* strength bar */}
            {novaSenha&&(
              <div style={{marginBottom:14}}>
                <div style={{display:'flex',justifyContent:'space-between',fontSize:10,color:'var(--t3)',marginBottom:4}}>
                  <span>Força da senha</span>
                  <span style={{color:novaSenha.length>=8?'var(--green)':novaSenha.length>=6?'var(--amber)':'var(--red)'}}>
                    {novaSenha.length>=8?'Forte':novaSenha.length>=6?'Média':'Fraca'}
                  </span>
                </div>
                <div className="progress-bar" style={{height:4}}>
                  <div className="progress-fill" style={{
                    width:`${novaSenha.length>=8?100:novaSenha.length>=6?66:33}%`,
                    background:novaSenha.length>=8?'var(--green)':novaSenha.length>=6?'var(--amber)':'var(--red)'
                  }}/>
                </div>
              </div>
            )}
            {senhaMsg.err&&<div className="perfil-msg-err"><Ic.AlertTriangle s={13} c='var(--red)'/> {senhaMsg.err}</div>}
            {senhaMsg.ok&&<div className="perfil-msg-ok"><Ic.Check s={13} c='var(--green)'/> {senhaMsg.ok}</div>}
            <div style={{display:'flex',justifyContent:'flex-end',marginTop:16}}>
              <button className="btn btn-primary" onClick={handleSaveSenha}>
                <Ic.Lock s={14}/> Alterar senha
              </button>
            </div>
          </div>
        )}

        {/* ── Seção: Google ── */}
        {secao==='google'&&<GoogleSection gg={gg}/>}

        {/* ── Zona de perigo ── */}
        <div className="perfil-danger">
          <div style={{fontFamily:'Syne',fontWeight:700,fontSize:13,color:'var(--red)',display:'flex',alignItems:'center',gap:7,marginBottom:12}}>
            <Ic.AlertTriangle s={14} c='var(--red)'/> Zona de Perigo
          </div>
          <div style={{fontSize:12,color:'var(--t2)',marginBottom:14,lineHeight:1.6}}>
            Excluir sua conta apaga permanentemente todos os seus dados — agenda, planos, metas e histórico. Esta ação <strong style={{color:'var(--t1)'}}>não pode ser desfeita</strong>.
          </div>
          <button className="btn btn-danger btn-sm" onClick={handleDeleteAccount}>
            <Ic.Trash s={13}/> Excluir minha conta
          </button>
        </div>

        {/* Logout rápido */}
        <div style={{display:'flex',justifyContent:'flex-end',paddingBottom:20}}>
          <button className="btn btn-ghost btn-sm" onClick={onLogout} style={{color:'var(--t3)'}}>
            <Ic.LogOut s={13}/> Sair da conta
          </button>
        </div>
      </div>
    </div>
  );
}

/* ─────────── SIDEBAR NAV ─────────── */
function Sidebar({aba,onAba,collapsed,onToggle,user,onLogout,userPhoto,mobileOpen,onCloseMobile}){
  const items=[
    {id:'dashboard',label:'Dashboard',icon:<Ic.Dash/>},
    {id:'agenda',label:'Agenda',icon:<Ic.Calendar/>},
    {id:'planejar',label:'Planejar Dia',icon:<Ic.Plan/>},
    {id:'meudia',label:'Meu Dia',icon:<Ic.Today/>},
    {id:'metas',label:'Metas',icon:<Ic.Flag/>},
  ];
  const displayName=user?.nome||user?.username||'?';
  const initials=displayName.slice(0,2).toUpperCase();

  const handleNav=(id)=>{onAba(id);if(onCloseMobile)onCloseMobile();};

  return(
    <>
      {/* Mobile overlay backdrop */}
      {mobileOpen&&<div className="sidebar-overlay" onClick={onCloseMobile}/>}
      <div className={`sidebar ${collapsed?'collapsed':''} ${mobileOpen?'mobile-open':''}`}>
        <div className="sidebar-logo">
          <button className="sidebar-toggle" onClick={onToggle}><Ic.Menu s={19}/></button>
          <div className="sidebar-logo-text">
            <span style={{color:'#F0FFF4'}}>Inovit </span>
            <span style={{color:'#22C55E'}}>Flow</span>
          </div>
          {/* Mobile close button */}
          <button className="sidebar-toggle" onClick={onCloseMobile} style={{marginLeft:'auto',display:'none'}} id="sidebar-close-btn">
            <Ic.X s={18}/>
          </button>
        </div>
        <div className="sidebar-nav">
          {!collapsed&&<div style={{fontSize:10,color:'var(--t3)',fontWeight:600,textTransform:'uppercase',letterSpacing:'.7px',padding:'6px 12px 8px'}}>Menu</div>}
          {items.map(item=>(
            <div key={item.id} className={`nav-item ${aba===item.id?'active':''}`} onClick={()=>handleNav(item.id)} title={collapsed?item.label:''}>
              <div className="icon-wrap" style={{color:aba===item.id?'var(--accent)':'var(--t2)'}}>{item.icon}</div>
              <span className="label">{item.label}</span>
            </div>
          ))}
          {!collapsed&&<div style={{fontSize:10,color:'var(--t3)',fontWeight:600,textTransform:'uppercase',letterSpacing:'.7px',padding:'12px 12px 8px',borderTop:'1px solid var(--border)',marginTop:6}}>Conta</div>}
          {collapsed&&<div style={{height:14,borderTop:'1px solid var(--border)',marginTop:6,marginBottom:6}}/>}
          <div className={`nav-item ${aba==='perfil'?'active':''}`} onClick={()=>handleNav('perfil')} title={collapsed?'Perfil':''}>
            <div className="icon-wrap" style={{color:aba==='perfil'?'var(--accent)':'var(--t2)'}}><Ic.User/></div>
            <span className="label">Perfil</span>
          </div>
        </div>
        <div className="sidebar-bottom">
          <div className="sidebar-user" onClick={()=>handleNav('perfil')} title={collapsed?`${displayName} — Perfil`:''} style={{cursor:'pointer'}}>
            <div className="user-avatar" style={{background:userPhoto?'transparent':aba==='perfil'?'linear-gradient(135deg,#4ADE80,#22C55E)':'linear-gradient(135deg,#22C55E,#16A34A)',padding:0,overflow:'hidden'}}>
              {userPhoto?<img src={userPhoto} className="sidebar-avatar-photo" alt=""/>:initials}
            </div>
            <div className="sidebar-user-info" style={{flex:1,overflow:'hidden'}}>
              <div style={{fontWeight:600,fontSize:12,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{displayName}</div>
              <div style={{fontSize:10,color:'var(--t2)',display:'flex',alignItems:'center',gap:3,marginTop:1}}><Ic.User s={10}/> Ver perfil</div>
            </div>
          </div>
        </div>
      </div>
    </>
  );
}

/* ─────────── TOPBAR ─────────── */
function Topbar({aba,clock,hora,eventos,onOpenSidebar}){
  const labels={dashboard:'Dashboard',agenda:'Agenda',planejar:'Planejar Dia',meudia:'Meu Dia',metas:'Metas & Objetivos',perfil:'Meu Perfil'};
  const todayYMD=toYMD(today());
  const nm=toMins(clock);
  const agEvs=getEvForDate(eventos,todayYMD);
  const prox=[...agEvs].filter(e=>toMins(e.horaInicio)>nm).sort((a,b)=>toMins(a.horaInicio)-toMins(b.horaInicio))[0];
  return(
    <div className="topbar">
      <button className="topbar-burger" onClick={onOpenSidebar}><Ic.Menu s={20}/></button>
      <div className="topbar-title">{labels[aba]||''}</div>
      {prox&&aba!=='meudia'&&(
        <div className="topbar-prox" style={{display:'flex',alignItems:'center',gap:7,padding:'5px 12px',background:'rgba(34,197,94,.08)',borderRadius:9,border:'1px solid rgba(34,197,94,.18)'}}>
          <Ic.Today s={13} c='var(--accent)'/>
          <span style={{fontSize:12,fontWeight:500}}>{prox.titulo}</span>
          <span style={{fontSize:11,color:'var(--t2)',fontVariantNumeric:'tabular-nums'}}><Countdown targetTime={prox.horaInicio}/></span>
        </div>
      )}
      {hora>=20&&(
        <div className="topbar-night" style={{display:'flex',alignItems:'center',gap:5,padding:'5px 11px',background:'rgba(34,197,94,.07)',borderRadius:9,border:'1px solid rgba(34,197,94,.16)'}}>
          <Ic.Moon s={13} c='var(--accent)'/>
          <span style={{fontSize:12,color:'var(--accent2)'}}>Planejou amanhã?</span>
        </div>
      )}
      <div className="topbar-time">{clock}</div>
    </div>
  );
}

function BottomNav({aba,onAba}){
  const items=[
    {id:'dashboard',icon:<Ic.Dash s={20}/>,label:'Dash'},
    {id:'agenda',icon:<Ic.Calendar s={20}/>,label:'Agenda'},
    {id:'meudia',icon:<Ic.Today s={20}/>,label:'Hoje'},

          {it.icon}

/* ─────────── APP ─────────── */
function App(){
  const [session,setSession]=useState(()=>authStore.session());
  const [aba,setAba]=useState('agenda');
  const [collapsed,setCollapsed]=useState(false);
  const [mobileOpen,setMobileOpen]=useState(false);
  const [clock,setClock]=useState(nowTime());
  const hora=parseInt(clock.split(':')[0]);

  // user-scoped store
  const store=useMemo(()=>session?makeStore(session.userId):null,[session]);

  const [eventos,setEventos]=useState(()=>store?store.evs():[]);
  const [planos,setPlanos]=useState(()=>store?store.plans():{});
  const [pinnedBlocos,setPinnedBlocos]=useState(()=>store?store.pinned():[]);
  const [metas,setMetas]=useState(()=>store?store.metas():[]);
  const [userPhoto,setUserPhoto]=useState(()=>session?authStore.photo(session.userId):null);

  // Google state
  const [ggConnected,setGgConnected]=useState(()=>GG.connected()&&!GG.expired());
  const [ggSyncing,setGgSyncing]=useState(false);
  const [ggLastSync,setGgLastSync]=useState(null);
  const [ggError,setGgError]=useState(null);

  useEffect(()=>{const iv=setInterval(()=>setClock(nowTime()),60000);return()=>clearInterval(iv);},[]);

  // reload data when session changes
  useEffect(()=>{
    if(store){setEventos(store.evs());setPlanos(store.plans());setPinnedBlocos(store.pinned());setMetas(store.metas());}
    if(session){setUserPhoto(authStore.photo(session.userId));}
  },[store]);

  // Init GIS + auto-sync on load if connected
  useEffect(()=>{
    if(!GG.clientId())return;
    ggEnsureClient().then(()=>{
      if(GG.connected()&&!GG.expired())doGgSync();
    }).catch(()=>{});
  },[]);

  const doGgSync=async()=>{
    if(!GG.connected())return;
    setGgSyncing(true);setGgError(null);
    try{
      if(GG.expired())await ggRequestToken('');
      const merged=await ggPullAndMerge(store.evs());
      store.saveEvs(merged);setEventos([...merged]);
      setGgLastSync(new Date());setGgConnected(true);
    }catch(e){
      const msg=e.status===401||e==='invalid_grant'?'Sessão expirada — reconecte o Google.':'Erro ao sincronizar. Tente novamente.';
      setGgError(msg);
      if(e.status===401||e==='invalid_grant'){setGgConnected(false);GG.disconnect();}
    }
    setGgSyncing(false);
  };

  const ggConnect=async()=>{
    setGgError(null);
    try{
      await ggEnsureClient();
      await ggRequestToken('consent');
      setGgConnected(true);
      await doGgSync();
    }catch(e){
      const msgs={'no_client_id':'Informe o Client ID primeiro.','gis_not_loaded':'Biblioteca Google não carregou. Verifique sua conexão.','popup_closed_by_user':'Login cancelado.','not_init':'Erro de inicialização.'};
      setGgError(msgs[e]||'Erro ao autenticar. Verifique o Client ID e as Origens permitidas no Google Cloud.');
    }
  };

  const ggDisconnect=()=>{
    GG.disconnect();setGgConnected(false);setGgLastSync(null);setGgError(null);
    const noGg=store.evs().filter(e=>!e.fromGoogle);
    store.saveEvs(noGg);setEventos([...noGg]);
  };

  const ggProps={connected:ggConnected,syncing:ggSyncing,lastSync:ggLastSync,error:ggError,connect:ggConnect,sync:doGgSync,disconnect:ggDisconnect};

  const handleLogin=(sess)=>{setSession(sess);setUserPhoto(authStore.photo(sess.userId));};
  const handleUpdateSession=(sess)=>{setSession(sess);};
  const handleUpdatePhoto=(data)=>{authStore.savePhoto(session.userId,data);setUserPhoto(data);};
  const handleLogout=()=>{if(confirm('Sair da conta?')){authStore.clearSession();setSession(null);setEventos([]);setPlanos({});setPinnedBlocos([]);setMetas([]);setUserPhoto(null);}};

  const handleSaveEvento=(ev,override)=>{
    const cur=store.evs();
    const isUpd=cur.some(e=>e.id===ev.id);
    const novo=override||(isUpd?cur.map(e=>e.id===ev.id?ev:e):[...cur,ev]);
    store.saveEvs(novo);setEventos([...novo]);
    if(!override&&!ev.fromGoogle&&GG.connected()){
      (async()=>{
        try{
          if(GG.expired())await ggRequestToken('');
          const existing=cur.find(e=>e.id===ev.id);
          if(existing?.googleId){await ggUpdate(existing.googleId,ev);}
          else{
            const gid=await ggCreate(ev);
            if(gid){const upd=store.evs().map(e=>e.id===ev.id?{...e,googleId:gid}:e);store.saveEvs(upd);setEventos([...upd]);}
          }
        }catch(e){console.warn('GG push failed',e);}
      })();
    }
  };

  const handleDeleteEvento=(id)=>{
    const ev=store.evs().find(e=>e.id===id);
    const novo=store.evs().filter(e=>e.id!==id);
    store.saveEvs(novo);setEventos([...novo]);
    if(ev?.googleId&&GG.connected()){ggDeleteEv(ev.googleId).catch(e=>console.warn('GG delete fail',e));}
  };
  const handleSavePlano=(data,plano)=>{const cur=store.plans();const novo={...cur,[data]:plano};store.savePlans(novo);setPlanos({...novo});};
  const handleSavePinned=(pins)=>{store.savePinned(pins);setPinnedBlocos([...pins]);};
  const handleSaveMetas=(novo)=>{store.saveMetas(novo);setMetas([...novo]);};

  // close sidebar when tab changes on mobile
  const handleAba=(id)=>{setAba(id);setMobileOpen(false);};

  if(!session) return <LoginPage onLogin={handleLogin}/>;

  return(
    <>
      <Sidebar aba={aba} onAba={handleAba} collapsed={collapsed} onToggle={()=>setCollapsed(p=>!p)} user={session} onLogout={handleLogout} userPhoto={userPhoto} mobileOpen={mobileOpen} onCloseMobile={()=>setMobileOpen(false)}/>
      <div className="main-content">
        <Topbar aba={aba} clock={clock} hora={hora} eventos={eventos} onOpenSidebar={()=>setMobileOpen(true)}/>
        {hora>=20&&aba!=='planejar'&&(
          <div className="banner">
            <Ic.Moon s={15} c='var(--accent2)'/>
            <span className="banner-text" style={{fontSize:13}}>Já planejou o seu dia de amanhã?</span>
            <button className="btn btn-accent2 btn-sm" onClick={()=>handleAba('planejar')}>Planejar agora →</button>
            <button className="btn-icon btn-sm" style={{width:26,height:26,marginLeft:4}} onClick={()=>{}}>
              <Ic.X s={14}/>
            </button>
          </div>
        )}
        {aba==='dashboard'&&<DashboardTab planos={planos} eventos={eventos}/>}
        {aba==='metas'&&<MetasTab metas={metas} onSaveMetas={handleSaveMetas}/>}
        {aba==='agenda'&&<AgendaTab eventos={eventos} onSaveEvento={handleSaveEvento} onDeleteEvento={handleDeleteEvento} gg={ggProps}/>}
        {aba==='planejar'&&<PlanejaDiaTab eventos={eventos} planos={planos} pinnedBlocos={pinnedBlocos} onSavePlano={handleSavePlano} onSavePinned={handleSavePinned}/>}
        {aba==='meudia'&&<MeuDiaTab eventos={eventos} planos={planos} pinnedBlocos={pinnedBlocos} onSavePlano={handleSavePlano} onGoPlanejar={()=>handleAba('planejar')}/>}
        {aba==='perfil'&&<PerfilTab session={session} onUpdateSession={handleUpdateSession} onLogout={handleLogout} userPhoto={userPhoto} onUpdatePhoto={handleUpdatePhoto} gg={ggProps}/>}
        <BottomNav aba={aba} onAba={handleAba}/>
      </div>
    </>
  );
}

try {
  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  document.getElementById('loading').style.display='none';
} catch(e) {
  document.getElementById('loading').style.display='none';
  var box=document.getElementById('error-box');
  box.style.display='flex';
  document.getElementById('error-msg').textContent=e.stack||String(e);
}
</script>
</body>

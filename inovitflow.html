<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Inovit Flow">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#060906">
<title>Inovit Flow</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.23.10/babel.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#060906;--surface:#0A0F0A;--surf2:#0F160F;--surf3:#162016;
  --border:rgba(34,197,94,0.08);--border2:rgba(34,197,94,0.15);
  --accent:#22C55E;--accent2:#4ADE80;--green:#22C55E;--amber:#F59E0B;--red:#EF4444;--cyan:#06B6D4;
  --t1:#F0FFF4;--t2:#7A9A82;--t3:#3A5240;
  --sidebar-w:240px;
  --radius:14px;--radius-sm:10px;
}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--t1);font-family:'DM Sans',sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
#root{height:100vh;height:100dvh;display:flex;overflow:hidden}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--surf3);border-radius:99px}
button{cursor:pointer;border:none;background:none;color:inherit;font-family:inherit;font-size:inherit;touch-action:manipulation}
input,textarea,select{font-family:inherit;font-size:inherit;color:var(--t1);background:var(--surf2);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:9px 13px;outline:none;width:100%;transition:border-color .2s,box-shadow .2s}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(34,197,94,.12)}
textarea{resize:vertical}
select option{background:var(--surf2)}

/* ANIMATIONS */
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideInLeft{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:translateX(0)}}
@keyframes slideUp{from{opacity:0;transform:translateY(28px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes pulseDot{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.5)}70%{box-shadow:0 0 0 7px rgba(239,68,68,0)}}
@keyframes shimmer{0%{background-position:-200% center}100%{background-position:200% center}}
@keyframes pulseRing{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(1.08);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

.fade-in{animation:fadeIn .22s ease both}
.slide-in{animation:slideInLeft .22s ease both}
.slide-up{animation:slideUp .28s cubic-bezier(.16,1,.3,1) both}

/* SIDEBAR */
.sidebar{width:var(--sidebar-w);background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;transition:width .25s cubic-bezier(.4,0,.2,1);overflow:hidden;z-index:100;position:relative}
.sidebar.collapsed{width:64px}
.sidebar-logo{padding:18px 16px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);flex-shrink:0;min-height:64px}
.sidebar-logo-text{font-family:'Syne',sans-serif;font-weight:800;font-size:17px;white-space:nowrap;overflow:hidden;color:#F0FFF4;transition:opacity .2s}
.sidebar.collapsed .sidebar-logo-text{opacity:0;width:0}
.sidebar-nav{flex:1;padding:10px 8px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:var(--radius-sm);cursor:pointer;color:var(--t2);transition:all .18s;white-space:nowrap;margin-bottom:2px}
.nav-item:hover{background:rgba(255,255,255,.05);color:var(--t1)}
.nav-item.active{background:rgba(34,197,94,.12);color:var(--t1);border:1px solid rgba(34,197,94,.22)}
.nav-item .label{font-weight:500;font-size:13px;overflow:hidden;transition:opacity .2s,width .2s}
.sidebar.collapsed .nav-item .label{opacity:0;width:0;overflow:hidden}
.nav-item .icon-wrap{flex-shrink:0;display:flex;align-items:center;justify-content:center;width:22px}
.sidebar-bottom{padding:10px 8px 16px;border-top:1px solid var(--border);flex-shrink:0}
.sidebar-user{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-sm);background:var(--surf2);cursor:pointer}
.user-avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#22C55E,#16A34A);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:#000;flex-shrink:0}
.sidebar-user-info{overflow:hidden;transition:opacity .2s}
.sidebar.collapsed .sidebar-user-info{opacity:0;width:0}
.sidebar-toggle{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--t2);transition:background .15s,color .15s}
.sidebar-toggle:hover{background:rgba(255,255,255,.07);color:var(--t1)}

/* TOPBAR */
.topbar{height:60px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:12px;flex-shrink:0;position:relative;z-index:50}
.topbar-title{font-family:'Syne',sans-serif;font-weight:700;font-size:17px;flex:1}
.topbar-time{font-size:13px;color:var(--t2);font-variant-numeric:tabular-nums}

/* MAIN */
.main-content{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}

/* BUTTONS */
.btn{padding:8px 16px;border-radius:var(--radius-sm);font-weight:500;transition:all .18s;display:inline-flex;align-items:center;gap:7px;font-size:13px;white-space:nowrap}
.btn-primary{background:linear-gradient(135deg,#22C55E,#16A34A);color:#000;font-weight:600;box-shadow:0 2px 12px rgba(34,197,94,.3)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 4px 18px rgba(34,197,94,.4)}
.btn-primary:active{transform:translateY(0)}
.btn-ghost{color:var(--t2);border:1px solid var(--border2);background:transparent}
.btn-ghost:hover{color:var(--t1);background:rgba(255,255,255,.05);border-color:var(--border2)}
.btn-danger{background:rgba(239,68,68,.12);color:var(--red);border:1px solid rgba(239,68,68,.18)}
.btn-danger:hover{background:rgba(239,68,68,.2)}
.btn-success{background:rgba(34,197,94,.12);color:var(--green);border:1px solid rgba(34,197,94,.18)}
.btn-accent2{background:rgba(74,222,128,.1);color:var(--accent2);border:1px solid rgba(74,222,128,.2)}
.btn-accent2:hover{background:rgba(74,222,128,.18)}
.btn-sm{padding:5px 12px;font-size:12px;border-radius:8px;gap:5px}
.btn-xs{padding:3px 9px;font-size:11px;border-radius:7px;gap:4px}
.btn-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--t2);transition:background .15s,color .15s;flex-shrink:0}
.btn-icon:hover{background:rgba(255,255,255,.07);color:var(--t1)}
.btn-icon.active{color:var(--accent)}

/* LOGIN */
.login-page{flex:1;display:flex;align-items:center;justify-content:center;background:var(--bg);position:relative;overflow:hidden}
.login-bg{position:absolute;inset:0;background:radial-gradient(ellipse 60% 60% at 50% 0%,rgba(34,197,94,.1),transparent),radial-gradient(ellipse 40% 40% at 80% 80%,rgba(22,163,74,.08),transparent);pointer-events:none}
.login-card{background:var(--surface);border:1px solid var(--border2);border-radius:22px;padding:40px;width:100%;max-width:400px;position:relative;box-shadow:0 24px 60px rgba(0,0,0,.5)}
.login-logo{font-family:'Syne',sans-serif;font-weight:800;font-size:26px;text-align:center;margin-bottom:6px;color:#F0FFF4;letter-spacing:-0.5px}
.login-sub{font-size:13px;color:var(--t2);text-align:center;margin-bottom:28px}
.login-tabs{display:flex;background:var(--surf2);border-radius:10px;padding:3px;margin-bottom:24px;gap:3px}
.login-tab{flex:1;padding:7px;border-radius:8px;text-align:center;font-size:13px;font-weight:500;color:var(--t2);cursor:pointer;transition:all .2s}
.login-tab.active{background:var(--surf3);color:var(--t1)}
.login-field{margin-bottom:14px}
.login-field label{display:block;font-size:12px;font-weight:600;color:var(--t2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.login-err{font-size:12px;color:var(--red);margin-top:-8px;margin-bottom:10px}
.login-divider{text-align:center;font-size:11px;color:var(--t3);margin:16px 0}

/* MODAL */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:20px;width:100%;max-width:580px;max-height:92vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 32px 80px rgba(0,0,0,.6)}
.modal-sm{max-width:440px}
.modal-header{padding:22px 26px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;background:linear-gradient(180deg,var(--surf2) 0%,var(--surface) 100%)}
.modal-title{font-family:'Syne',sans-serif;font-weight:700;font-size:17px}
.modal-body{padding:20px 26px;overflow-y:auto;flex:1}
.modal-footer{padding:16px 26px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;flex-shrink:0}

/* FORM */
.field{margin-bottom:15px}
.field label{display:block;font-size:11px;font-weight:600;color:var(--t2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.6px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cat-option{padding:9px 6px;border-radius:11px;border:1.5px solid var(--border2);text-align:center;cursor:pointer;transition:all .18s;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:4px}
.cat-option:hover{border-color:var(--border2);background:rgba(255,255,255,.04)}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;background:var(--surf2);border-radius:var(--radius-sm);border:1px solid var(--border)}
.toggle{position:relative;width:42px;height:23px;cursor:pointer;flex-shrink:0}
.toggle input{display:none}
.toggle-track{position:absolute;inset:0;background:var(--t3);border-radius:12px;transition:.3s}
.toggle input:checked+.toggle-track{background:var(--accent)}
.toggle-thumb{position:absolute;top:3px;left:3px;width:17px;height:17px;background:#fff;border-radius:50%;transition:.3s;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.toggle input:checked~.toggle-thumb{left:22px}
.days-row{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.day-chip{padding:4px 11px;border-radius:8px;border:1px solid var(--border2);font-size:12px;cursor:pointer;transition:all .18s}
.day-chip.active{background:var(--accent);border-color:var(--accent);color:#000;font-weight:600}
.prio-row{display:flex;gap:6px}
.prio-btn{padding:6px 14px;border-radius:8px;border:1.5px solid var(--border2);font-size:12px;cursor:pointer;transition:all .18s}

/* CALENDAR */
.cal-header{display:flex;align-items:center;gap:10px;padding:16px 22px 12px;flex-shrink:0}
.cal-title{font-family:'Syne',sans-serif;font-weight:700;font-size:19px;flex:1}
.view-btns{display:flex;background:var(--surf2);border-radius:10px;padding:3px;gap:2px}
.view-btn{padding:5px 14px;border-radius:8px;font-size:12px;font-weight:500;color:var(--t2);transition:all .18s;cursor:pointer}
.view-btn.active{background:var(--accent);color:#000}
.month-grid{display:grid;grid-template-columns:repeat(7,1fr);border-radius:var(--radius);overflow:hidden;border:1px solid var(--border)}
.month-dow{background:var(--surf2);padding:9px 0;text-align:center;font-size:10px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.6px;border-bottom:1px solid var(--border)}
.month-day{background:var(--surface);padding:7px 8px;min-height:82px;cursor:pointer;transition:background .12s;border-right:1px solid var(--border);border-bottom:1px solid var(--border)}
.month-day:nth-child(7n){border-right:none}
.month-day:hover{background:rgba(255,255,255,.025)}
.month-day.other-month .day-num{color:var(--t3)}
.month-day.today .day-num{background:var(--accent);color:#000;font-weight:700;box-shadow:0 2px 10px rgba(34,197,94,.4)}
.month-day.selected{background:rgba(34,197,94,.06)}
.day-num{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;margin-bottom:5px}
.ev-pill{font-size:10px;padding:2px 6px;border-radius:5px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* PAINEL */
.painel{width:310px;border-left:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
.painel-header{padding:18px 18px 12px;border-bottom:1px solid var(--border)}
.ev-card{background:var(--surf2);border-radius:12px;padding:12px;margin-bottom:8px;border-left:3px solid transparent;transition:transform .15s}
.ev-card:hover{transform:translateX(2px)}

/* TIMELINE */
.tl-wrap{flex:1;overflow-y:auto;padding-right:6px}
.tl-row{display:flex;min-height:44px;align-items:flex-start;position:relative}
.tl-time{width:54px;flex-shrink:0;font-size:10px;color:var(--t3);font-weight:600;padding-top:5px;font-variant-numeric:tabular-nums}
.tl-rail{width:1px;background:var(--border);flex-shrink:0;margin-right:14px;align-self:stretch}
.tl-col{flex:1;padding:2px 0}
.tl-block{border-radius:11px;padding:9px 13px;margin-bottom:5px;transition:transform .15s;position:relative}
.tl-block:hover{transform:translateX(2px)}
.tl-block.done{opacity:.45}
.tl-block.late{border-color:var(--red)!important;background:rgba(239,68,68,.07)!important}
.tl-block.current{animation:pulseRing 2.5s infinite}
.tl-slot-empty{border:1.5px dashed rgba(255,255,255,.09);border-radius:11px;padding:7px 13px;font-size:11px;color:var(--t3);cursor:pointer;display:flex;align-items:center;gap:7px;margin-bottom:5px;transition:all .18s}
.tl-slot-empty:hover{border-color:var(--accent);color:var(--accent);background:rgba(34,197,94,.05)}
.tl-agenda-block{border-radius:11px;padding:9px 13px;margin-bottom:5px;border:1px solid transparent}
.tl-pin-badge{display:inline-flex;align-items:center;gap:3px;font-size:9px;font-weight:600;padding:2px 6px;border-radius:5px;background:rgba(245,158,11,.15);color:var(--amber);margin-left:6px}

/* PROGRESS */
.progress-bar{height:5px;background:rgba(255,255,255,.07);border-radius:99px;overflow:hidden}
.progress-fill{height:100%;border-radius:99px;transition:width .5s ease}

/* CARDS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px}
.card-sm{padding:13px}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat-card{background:var(--surf2);border-radius:12px;padding:13px;text-align:center;border:1px solid var(--border)}
.stat-num{font-family:'Syne',sans-serif;font-size:22px;font-weight:800}
.stat-label{font-size:10px;color:var(--t2);margin-top:2px}
.next-card{background:linear-gradient(135deg,rgba(34,197,94,.08),rgba(22,163,74,.05));border:1px solid rgba(34,197,94,.2);border-radius:var(--radius);padding:18px}

/* BADGE */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:600}
.badge-green{background:rgba(34,197,94,.12);color:var(--green)}
.badge-amber{background:rgba(245,158,11,.12);color:var(--amber)}
.badge-red{background:rgba(239,68,68,.12);color:var(--red)}
.badge-blue{background:rgba(34,197,94,.12);color:var(--accent)}

.section-title{font-size:11px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.7px;margin-bottom:10px}
.divider{height:1px;background:var(--border);margin:14px 0}
.countdown-num{font-family:'Syne',sans-serif;font-size:26px;font-weight:800;color:var(--accent)}
.empty-state{text-align:center;padding:40px 20px;color:var(--t3)}
.summary-bar-row{display:flex;align-items:center;gap:8px;font-size:11px;margin-bottom:6px}
.summary-bar-label{width:110px;color:var(--t2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px}
.summary-bar-track{flex:1;height:5px;background:rgba(255,255,255,.07);border-radius:99px;overflow:hidden}
.summary-bar-fill{height:100%;border-radius:99px}
.summary-bar-val{width:30px;text-align:right;color:var(--t3);font-size:10px}

/* DASHBOARD */
.dash-wrap{flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:18px}
.dash-period{display:flex;background:var(--surf2);border-radius:11px;padding:3px;gap:2px;border:1px solid var(--border)}
.dash-period-btn{flex:1;padding:7px 0;border-radius:9px;text-align:center;font-size:12px;font-weight:500;color:var(--t2);cursor:pointer;transition:all .18s}
.dash-period-btn.active{background:var(--accent);color:#000;font-weight:700}
.dash-grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.dash-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.dash-grid-3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:16px}
.dash-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px}
.dash-stat-num{font-family:'Syne',sans-serif;font-weight:800;font-size:28px;line-height:1;margin-bottom:4px}
.dash-stat-label{font-size:11px;color:var(--t2);font-weight:500}
.dash-stat-sub{font-size:10px;color:var(--t3);margin-top:3px}
.dash-card-title{font-family:'Syne',sans-serif;font-weight:700;font-size:13px;margin-bottom:14px;display:flex;align-items:center;gap:7px}
.hbar-row{margin-bottom:9px}
.hbar-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--t2);margin-bottom:4px}
.hbar-track{height:8px;background:var(--surf3);border-radius:99px;overflow:hidden}
.hbar-fill{height:100%;border-radius:99px;transition:width .6s ease}
.legend-row{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-size:12px}
.legend-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.donut-wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.rank-item{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--surf2);border-radius:10px;margin-bottom:6px;border:1px solid var(--border)}
.rank-num{font-family:'Syne',sans-serif;font-weight:800;font-size:16px;width:24px;text-align:center;color:var(--t3)}
.rank-num.first{color:var(--accent)}
@media(max-width:700px){.dash-grid-4{grid-template-columns:1fr 1fr}.dash-grid-2{grid-template-columns:1fr}.dash-grid-3{grid-template-columns:1fr}}

/* METAS */
.metas-wrap{flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:0}
.metas-col{flex:1;display:flex;flex-direction:column;min-width:0}
.metas-cols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;flex:1;min-height:0}
.meta-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;display:flex;flex-direction:column;min-height:200px}
.meta-section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.meta-section-title{font-family:'Syne',sans-serif;font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px}
.meta-add-row{display:flex;gap:8px;margin-bottom:12px}
.meta-add-input{flex:1;font-size:13px;padding:9px 13px;border-radius:var(--radius-sm);background:var(--surf2);border:1px solid var(--border2);color:var(--t1);outline:none;transition:border-color .2s,box-shadow .2s}
.meta-add-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(34,197,94,.1)}
.meta-add-input::placeholder{color:var(--t3)}
.meta-item{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:var(--radius-sm);background:var(--surf2);border:1px solid var(--border);margin-bottom:7px;transition:all .18s;cursor:default;group:true}
.meta-item:hover{border-color:var(--border2)}
.meta-item.done{opacity:.5}
.meta-item.done .meta-titulo{text-decoration:line-through;color:var(--t3)}
.meta-check{width:20px;height:20px;border-radius:6px;border:2px solid var(--border2);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;transition:all .18s;margin-top:1px}
.meta-check:hover{border-color:var(--accent)}
.meta-check.done{background:var(--accent);border-color:var(--accent)}
.meta-titulo{font-size:13px;font-weight:500;flex:1;line-height:1.4;word-break:break-word}
.meta-desc{font-size:11px;color:var(--t2);margin-top:3px;line-height:1.4}
.meta-tags{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.meta-tag{font-size:10px;padding:2px 7px;border-radius:5px;font-weight:600}
.meta-actions{display:flex;gap:2px;opacity:0;transition:opacity .15s;flex-shrink:0}
.meta-item:hover .meta-actions{opacity:1}
.meta-prio-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:6px}
.meta-filter-row{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.meta-filter-btn{padding:5px 13px;border-radius:8px;font-size:12px;font-weight:500;color:var(--t2);border:1px solid var(--border2);cursor:pointer;transition:all .18s}
.meta-filter-btn.active{background:rgba(34,197,94,.12);color:var(--accent);border-color:rgba(34,197,94,.25)}
.meta-progress{margin-bottom:6px}
.meta-progress-label{display:flex;justify-content:space-between;font-size:10px;color:var(--t3);margin-bottom:3px}
.meta-cat-badge{font-size:10px;padding:2px 8px;border-radius:5px;font-weight:600;flex-shrink:0;letter-spacing:.2px}
.meta-cat-tab{padding:6px 16px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;transition:all .18s;border:1.5px solid var(--border2);color:var(--t2);background:transparent}
.meta-cat-tab.active-pessoal{background:rgba(129,140,248,.15);color:#818CF8;border-color:rgba(129,140,248,.4)}
.meta-cat-tab.active-trabalho{background:rgba(245,158,11,.12);color:#F59E0B;border-color:rgba(245,158,11,.35)}
.meta-cat-tab.active-todas{background:rgba(34,197,94,.12);color:var(--accent);border-color:rgba(34,197,94,.25)}
.meta-qtd-bar{height:4px;background:var(--surf3);border-radius:99px;overflow:hidden;margin:6px 0 4px}
.meta-qtd-fill{height:100%;border-radius:99px;transition:width .3s}
.meta-qtd-row{display:flex;align-items:center;gap:7px;margin-top:2px}
.meta-qtd-btn{width:24px;height:24px;border-radius:7px;border:1px solid var(--border2);background:var(--surf2);color:var(--t1);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;transition:all .15s;flex-shrink:0;line-height:1;padding:0}
.meta-qtd-btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent);background:rgba(34,197,94,.08)}
.meta-qtd-btn:disabled{opacity:.3;cursor:default}
.meta-qtd-label{font-size:11px;color:var(--t2);flex:1}
@media(max-width:800px){.metas-cols{grid-template-columns:1fr}}

/* PINNED SECTION */
.pinned-section{background:rgba(245,158,11,.05);border:1px solid rgba(245,158,11,.15);border-radius:13px;padding:13px 16px;margin-bottom:12px}
.pinned-header{display:flex;align-items:center;gap:7px;margin-bottom:10px;font-size:12px;font-weight:600;color:var(--amber)}

/* BANNER */
.banner{display:flex;align-items:center;gap:12px;padding:10px 22px;background:linear-gradient(90deg,rgba(34,197,94,.12),rgba(22,163,74,.08));border-bottom:1px solid rgba(34,197,94,.18);flex-shrink:0}

/* WEEKLY */
.week-wrap{flex:1;overflow:auto}
.week-header-row{display:grid;position:sticky;top:0;z-index:10;background:var(--surface);border-bottom:1px solid var(--border2)}
.week-body{display:grid}
.week-time-cell{height:52px;border-bottom:1px solid var(--border);padding:4px 8px;font-size:10px;color:var(--t3);font-weight:500}
.week-day-cell{position:relative;border-left:1px solid var(--border);border-bottom:1px solid var(--border);height:52px}
.week-ev{position:absolute;left:2px;right:2px;border-radius:7px;padding:3px 6px;font-size:10px;font-weight:500;overflow:hidden;cursor:pointer;z-index:2}

/* glow effect */
.glow-green{box-shadow:0 0 20px rgba(34,197,94,.15)}

/* ── MOMENTUM SCROLL em iOS ── */
.sidebar-nav,.modal-body,.dash-wrap,.metas-wrap,.perfil-wrap,.tl-wrap{-webkit-overflow-scrolling:touch;overscroll-behavior:contain}

/* ── SIDEBAR OVERLAY (mobile) ── */
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(3px);z-index:299}
.topbar-burger{display:none;width:36px;height:36px;border-radius:9px;align-items:center;justify-content:center;color:var(--t2);flex-shrink:0}
.topbar-burger:hover{background:rgba(255,255,255,.07);color:var(--t1)}

/* ── BOTTOM NAV (mobile only) ── */
.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;height:calc(60px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--border);z-index:200;align-items:flex-start;justify-content:space-around;padding:0 4px;padding-bottom:env(safe-area-inset-bottom);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.bnav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--t3);cursor:pointer;transition:color .18s;padding:10px 0 6px;border-radius:0;font-size:9px;font-weight:600;letter-spacing:.3px;text-transform:uppercase;min-width:0;touch-action:manipulation}
.bnav-item.active{color:var(--accent)}
.bnav-item.active svg{filter:drop-shadow(0 0 6px rgba(34,197,94,.5))}
.bnav-item svg{flex-shrink:0}

/* ── RESPONSIVE BREAKPOINTS ── */
@media(max-width:768px){
  /* Viewport dinâmico (ajusta quando teclado abre) */
  #root{height:100dvh}

  /* Sidebar vira drawer overlay */
  .sidebar{
    position:fixed!important;left:-270px;top:0;bottom:0;width:280px!important;
    z-index:300;transition:left .3s cubic-bezier(.4,0,.2,1)!important;
    box-shadow:none;padding-top:env(safe-area-inset-top);
  }
  .sidebar.mobile-open{left:0;box-shadow:8px 0 40px rgba(0,0,0,.7)}
  .sidebar.collapsed{width:280px!important;left:-290px}
  .sidebar.collapsed.mobile-open{left:0}
  .sidebar.collapsed .sidebar-logo-text{opacity:1;width:auto}
  .sidebar.collapsed .nav-item .label{opacity:1;width:auto;overflow:visible}
  .sidebar.collapsed .sidebar-user-info{opacity:1;width:auto}
  .sidebar-overlay{display:block}
  .sidebar-toggle{display:none}
  .topbar-burger{display:flex}
  #sidebar-close-btn{display:flex!important}

  /* Topbar com safe area (notch) */
  .topbar{
    padding:0 14px;
    padding-top:env(safe-area-inset-top);
    gap:8px;
    height:calc(56px + env(safe-area-inset-top));
  }
  .topbar-title{font-size:15px}
  .topbar-prox{display:none!important}
  .topbar-night{display:none!important}

  /* Main content */
  .main-content{width:100%}

  /* Bottom nav visível */
  .bottom-nav{display:flex}

  /* Padding para não esconder atrás do bottom nav */
  .main-content > *:last-child{padding-bottom:calc(68px + env(safe-area-inset-bottom))}
  .dash-wrap,.metas-wrap,.perfil-wrap,.tl-wrap{padding-bottom:calc(84px + env(safe-area-inset-bottom))!important}

  /* Login */
  .login-card{padding:28px 20px;border-radius:22px;margin:16px}

  /* ── MODAL MOBILE — sheet bottom ── */
  .modal-backdrop{padding:0;align-items:flex-end}
  .modal{
    border-radius:24px 24px 0 0;
    /* dvh ajusta quando teclado aparece — sem perder o botão Salvar */
    max-height:88dvh;
    max-height:88vh; /* fallback */
    max-width:100%;
    width:100%;
  }
  .modal-sm{max-width:100%}
  .modal-header{
    padding:16px 20px 12px;
    position:sticky;top:0;z-index:2;
    background:var(--surface);
    /* alça de drag visual */
  }
  .modal-header::before{
    content:'';display:block;width:36px;height:4px;border-radius:99px;
    background:var(--border2);margin:0 auto 12px;
  }
  .modal-body{
    padding:14px 20px;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
    /* deixa espaço para o footer fixo */
    padding-bottom:8px;
  }
  .modal-footer{
    padding:12px 20px;
    padding-bottom:calc(12px + env(safe-area-inset-bottom));
    position:sticky;
    bottom:0;
    background:var(--surface);
    border-top:1px solid var(--border);
    z-index:2;
    /* botões full-width no mobile */
    flex-direction:row;
    gap:10px;
  }
  .modal-footer .btn{flex:1;justify-content:center;min-height:46px;font-size:14px}

  /* Inputs maiores para evitar zoom no iOS (< 16px causa zoom) */
  input,textarea,select{font-size:16px!important;min-height:44px;padding:10px 14px}
  textarea{min-height:unset}
  select{padding:10px 14px}

  /* Fields lado a lado → empilhados */
  .field-row{grid-template-columns:1fr}
  .cat-grid{grid-template-columns:repeat(3,1fr)}

  /* Prioridade empilhada em telas menores */
  .prio-row{flex-wrap:wrap;gap:6px}
  .prio-btn{flex:1;min-width:calc(33% - 6px);justify-content:center}

  /* Calendário */
  .cal-header{flex-wrap:wrap;padding:12px 14px 8px;gap:8px}
  .cal-title{font-size:16px;width:100%}
  .view-btns{width:100%;justify-content:stretch}
  .gg-btn-label{display:none}
  .view-btn{flex:1;text-align:center;padding:8px 0;min-height:38px}
  .month-day{min-height:52px;padding:5px 4px}
  .ev-pill{display:none}
  .painel{display:none}

  /* Dashboard */
  .dash-wrap{padding:14px;padding-top:16px}
  .dash-grid-4{grid-template-columns:1fr 1fr}
  .dash-grid-2{grid-template-columns:1fr}
  .dash-grid-3{grid-template-columns:1fr}
  .dash-stat-num{font-size:22px}
  .dash-card{padding:16px}

  /* Metas */
  .metas-cols{grid-template-columns:1fr}
  .metas-wrap{padding:14px}
  .meta-cat-tab{padding:8px 12px;font-size:11px}

  /* Timeline */
  .tl-time{width:42px;font-size:9px}

  /* Banner */
  .banner{padding:8px 14px;gap:8px;flex-wrap:wrap}
  .banner-text{font-size:12px}

  /* Perfil */
  .perfil-hero{flex-direction:column;align-items:center;text-align:center;padding:20px 16px}
  .perfil-wrap{padding:16px 14px}
  .perfil-hero .perfil-avatar-big,.perfil-hero .perfil-avatar-photo{margin-bottom:4px}
  .stat-grid{grid-template-columns:1fr 1fr}

  /* Week view */
  .week-wrap{overflow-x:auto}

  /* Botões com area de toque mínima */
  .btn{min-height:44px}
  .btn-sm{min-height:38px}
  .btn-xs{min-height:32px}
  .btn-icon{width:40px;height:40px}
}

@media(max-width:480px){
  .topbar-time{display:none}
  .dash-grid-4{grid-template-columns:1fr 1fr}
  .cat-grid{grid-template-columns:repeat(2,1fr)}
  .perfil-tabs .perfil-tab span{display:none}
  .prio-row{flex-direction:column}
  .prio-btn{width:100%;justify-content:flex-start}
  .login-card{padding:22px 16px}
  /* Modal mais compacto em telas muito pequenas */
  .modal{max-height:92dvh;max-height:92vh}
  .modal-header{padding:14px 16px 10px}
  .modal-body{padding:12px 16px}
  .modal-footer{padding:10px 16px;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
  /* Metas header compacto */
  .meta-cat-tab{padding:6px 10px;font-size:10px}
}

/* PERFIL */
.perfil-wrap{flex:1;overflow-y:auto;padding:28px 24px;display:flex;flex-direction:column;gap:0;max-width:700px;margin:0 auto;width:100%}

.perfil-section-title{font-family:'Syne',sans-serif;font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;margin-bottom:18px;padding-bottom:12px;border-bottom:1px solid var(--border);color:var(--t1)}
.perfil-msg-ok{font-size:12px;color:var(--green);display:flex;align-items:center;gap:5px;margin-top:10px;animation:fadeIn .2s ease}
.perfil-msg-err{font-size:12px;color:var(--red);display:flex;align-items:center;gap:5px;margin-top:10px}

.pw-wrap{position:relative}
.pw-wrap input{padding-right:42px}
.pw-eye{position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--t3);cursor:pointer;transition:color .15s;display:flex;align-items:center;background:none;border:none;padding:0}
.pw-eye:hover{color:var(--t2)}
.perfil-tabs{display:flex;background:var(--surf2);border-radius:11px;padding:3px;gap:2px;border:1px solid var(--border);margin-bottom:20px}
.perfil-tab{flex:1;padding:8px 0;border-radius:9px;text-align:center;font-size:12px;font-weight:500;color:var(--t2);cursor:pointer;transition:all .18s;display:flex;align-items:center;justify-content:center;gap:6px}
.perfil-tab.active{background:var(--surf3);color:var(--t1);border:1px solid var(--border2)}
.avatar-upload-wrap{position:relative;cursor:pointer;flex-shrink:0}

.avatar-overlay span{font-size:9px;font-weight:600;letter-spacing:.3px}

.perfil-avatar-photo{width:84px;height:84px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 4px rgba(34,197,94,.18),0 8px 32px rgba(34,197,94,.22)}

<body>
<div id="loading" style="position:fixed;inset:0;background:#060906;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;gap:16px">
  <div style="font-family:Syne,sans-serif;font-size:22px;font-weight:800;color:#F0FFF4">Inovit <span style="color:#22C55E">Flow</span></div>
  <div style="width:36px;height:36px;border:3px solid rgba(34,197,94,.2);border-top-color:#22C55E;border-radius:50%;animation:spin .8s linear infinite"></div>
  <div style="font-size:12px;color:#3A5240">Carregando...</div>
</div>
<div id="error-box" style="display:none;position:fixed;inset:0;background:#060906;display:none;align-items:center;justify-content:center;padding:24px">
  <div style="background:#0A0F0A;border:1px solid rgba(239,68,68,.3);border-radius:16px;padding:28px;max-width:500px;width:100%">
    <div style="color:#EF4444;font-size:15px;font-weight:700;margin-bottom:12px">Erro ao carregar</div>
    <pre id="error-msg" style="font-size:11px;color:#7A9A82;white-space:pre-wrap;word-break:break-all"></pre>
    <div style="margin-top:16px;font-size:12px;color:#3A5240">Tente abrir no <strong style="color:#F0FFF4">Google Chrome</strong> ou <strong style="color:#F0FFF4">Firefox</strong>.</div>
  </div>
</div>
<div id="root"></div>
<script>
window.onerror=function(msg,src,line,col,err){
  document.getElementById('loading').style.display='none';
  var box=document.getElementById('error-box');
  box.style.display='flex';
  document.getElementById('error-msg').textContent=(err?err.stack:msg)+'\n\nLinha: '+line+' Col: '+col;
};
window.addEventListener('unhandledrejection',function(e){
  document.getElementById('loading').style.display='none';
  var box=document.getElementById('error-box');
  box.style.display='flex';
  document.getElementById('error-msg').textContent=String(e.reason);
});
</script>

/* ─────────── GOOGLE CALENDAR ─────────── */
const GG={
  BASE:'https://www.googleapis.com/calendar/v3',
  SCOPE:'https://www.googleapis.com/auth/calendar',
  clientId:()=>localStorage.getItem('if_gg_cid')||'',
  token:()=>localStorage.getItem('if_gg_tok')||'',
  connected:()=>localStorage.getItem('if_gg_on')==='1'&&!!localStorage.getItem('if_gg_tok'),
  expired:()=>Date.now()>Number(localStorage.getItem('if_gg_exp')||0)-30000,
  saveToken(tok,exp){localStorage.setItem('if_gg_tok',tok);localStorage.setItem('if_gg_exp',String(Date.now()+exp*1000));localStorage.setItem('if_gg_on','1');},
  saveCid:(id)=>localStorage.setItem('if_gg_cid',id.trim()),
  disconnect(){localStorage.removeItem('if_gg_tok');localStorage.removeItem('if_gg_exp');localStorage.setItem('if_gg_on','0');},
  async req(path,opts={}){
    const r=await fetch(GG.BASE+path,{...opts,headers:{Authorization:`Bearer ${GG.token()}`,'Content-Type':'application/json',...(opts.headers||{})}});
    if(r.status===204)return null;
    const txt=await r.text();
    if(!r.ok){const err=new Error(`GG ${r.status}`);err.status=r.status;throw err;}
    return JSON.parse(txt);
  },
};

let _ggClient=null;
function ggEnsureClient(){
  return new Promise((res,rej)=>{
    const cid=GG.clientId();
    if(!cid){rej('no_client_id');return;}
    const setup=()=>{
      if(!window.google?.accounts?.oauth2)return false;
      _ggClient=window.google.accounts.oauth2.initTokenClient({client_id:cid,scope:GG.SCOPE,callback:()=>{}});
      return true;
    };
    if(setup()){res();return;}
    let n=0;
    const t=setInterval(()=>{n++;if(setup()){clearInterval(t);res();}else if(n>50){clearInterval(t);rej('gis_not_loaded');}},200);
  });
}

function ggRequestToken(prompt=''){
  return new Promise((res,rej)=>{
    if(!_ggClient){rej('not_init');return;}
    _ggClient.callback=(r)=>{if(r.error){rej(r.error);return;}GG.saveToken(r.access_token,r.expires_in);res(r.access_token);};
    _ggClient.requestAccessToken({prompt});
  });
}

const GG_TZ=()=>Intl.DateTimeFormat().resolvedOptions().timeZone;
function evToGG(ev){
  return{
    summary:ev.titulo,
    description:[ev.descricao,ev.participantes?`Participantes: ${ev.participantes}`:''].filter(Boolean).join('\n'),
    location:ev.local||'',
    start:{dateTime:`${ev.dataInicio}T${ev.horaInicio||'09:00'}:00`,timeZone:GG_TZ()},
    end:{dateTime:`${ev.dataInicio}T${ev.horaFim||'10:00'}:00`,timeZone:GG_TZ()},
  };
}
function evFromGG(gev){
  const d=(gev.start?.dateTime||gev.start?.date||'').slice(0,10);
  const hs=(gev.start?.dateTime||'').slice(11,16)||'09:00';
  const he=(gev.end?.dateTime||'').slice(11,16)||'10:00';
  return{id:uid(),googleId:gev.id,fromGoogle:true,titulo:gev.summary||'(sem título)',descricao:gev.description||'',local:gev.location||'',participantes:'',dataInicio:d,horaInicio:hs,horaFim:he,categoria:'reuniao',cor:'#22C55E',recorrencia:'nenhuma',diasSemana:[],diaDoMes:1,fixo:false,prioridade:'media',lembrete:null,realizado:false,criadoEm:gev.created||new Date().toISOString()};
}

async function ggPullAndMerge(localEvs){
  const now=new Date();
  const tMin=new Date(now.getFullYear(),now.getMonth()-1,1).toISOString();
  const tMax=new Date(now.getFullYear(),now.getMonth()+4,1).toISOString();
  const data=await GG.req(`/calendars/primary/events?timeMin=${encodeURIComponent(tMin)}&timeMax=${encodeURIComponent(tMax)}&singleEvents=true&maxResults=500&orderBy=startTime`);
  const gEvs=(data?.items||[]).filter(e=>e.status!=='cancelled');
  const gMap=new Map(gEvs.map(e=>[e.id,e]));
  let merged=localEvs.filter(e=>!e.fromGoogle||gMap.has(e.googleId));
  gEvs.forEach(gev=>{
    const idx=merged.findIndex(e=>e.googleId===gev.id);
    const c=evFromGG(gev);
    if(idx>=0)merged[idx]={...merged[idx],titulo:c.titulo,descricao:c.descricao,local:c.local,dataInicio:c.dataInicio,horaInicio:c.horaInicio,horaFim:c.horaFim,fromGoogle:true};
    else merged.push(c);
  });
  return merged;
}
async function ggCreate(ev){const d=await GG.req('/calendars/primary/events',{method:'POST',body:JSON.stringify(evToGG(ev))});return d?.id;}
async function ggUpdate(googleId,ev){await GG.req(`/calendars/primary/events/${googleId}`,{method:'PUT',body:JSON.stringify(evToGG(ev))});}
async function ggDeleteEv(googleId){await fetch(`${GG.BASE}/calendars/primary/events/${googleId}`,{method:'DELETE',headers:{Authorization:`Bearer ${GG.token()}`}});}

/* ─────────── DATE UTILS ─────────── */
const toYMD=(d)=>{const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${dd}`;};
const fromYMD=(s)=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const today=()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate());};
const tomorrow=()=>{const t=today();t.setDate(t.getDate()+1);return t;};
const addDays=(d,n)=>{const r=new Date(d);r.setDate(r.getDate()+n);return r;};
const fmtDate=(d)=>`${DIAS_F[d.getDay()]}, ${d.getDate()} de ${MESES[d.getMonth()]}`;
const fmtShort=(d)=>`${d.getDate()}/${d.getMonth()+1}`;
const nowTime=()=>{const n=new Date();return `${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`;};
const toMins=(hm)=>{if(!hm)return 0;const[h,m]=hm.split(':').map(Number);return h*60+m;};
const toHM=(mins)=>`${String(Math.floor(mins/60)).padStart(2,'0')}:${String(mins%60).padStart(2,'0')}`;
const daysInMonth=(y,m)=>new Date(y,m+1,0).getDate();
const firstDow=(y,m)=>new Date(y,m,1).getDay();
const uid=()=>crypto.randomUUID();
const hex2rgba=(hex,a)=>{const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return `rgba(${r},${g},${b},${a})`;};

const getEvForDate=(evs,ymd)=>{
  const d=fromYMD(ymd);const dow=d.getDay();const dom=d.getDate();
  return evs.filter(ev=>{
    if(ev.fixo&&ev.recorrencia!=='nenhuma'){
      if(ev.recorrencia==='diaria')return true;
      if(ev.recorrencia==='semanal'&&ev.diasSemana?.includes(dow))return true;
      if(ev.recorrencia==='mensal'&&ev.diaDoMes===dom)return true;
    }
    return ev.dataInicio===ymd;
  }).sort((a,b)=>toMins(a.horaInicio)-toMins(b.horaInicio));
};

/* ─────────── MODAL WRAPPER ─────────── */
function Modal({onClose,children,sm}){
  useEffect(()=>{
    const h=(e)=>{if(e.key==='Escape')onClose();};
    window.addEventListener('keydown',h);
    return()=>window.removeEventListener('keydown',h);
  },[onClose]);
  return(
    <div className="modal-backdrop" onClick={(e)=>{if(e.target===e.currentTarget)onClose();}}>
      <div className={`modal slide-up ${sm?'modal-sm':''}`}>{children}</div>
    </div>
  );
}

    setErr('');
    if(!form.username.trim()||!form.password)return setErr('Preencha todos os campos.');
    if(form.password!==form.confirm)return setErr('Senhas não coincidem.');
    if(form.password.length<4)return setErr('Senha muito curta (mínimo 4 caracteres).');
    const users=authStore.users();
    if(users.find(u=>u.username.toLowerCase()===form.username.trim().toLowerCase()))return setErr('Nome de usuário já existe.');
    const newUser={id:uid(),username:form.username.trim(),password:form.password,criadoEm:new Date().toISOString()};
    authStore.saveUsers([...users,newUser]);
    const session={userId:newUser.id,username:newUser.username};
    authStore.saveSession(session);

  };

  return(
    <div className="login-page">
      <div className="login-bg"/>
      <div className="login-card slide-up">

          <div className={`login-tab ${tab==='criar'?'active':''}`} onClick={()=>{setTab('criar');setErr('');}}>Criar conta</div>
        </div>
        <div className="login-field">
          <label>Usuário</label>
          <div style={{position:'relative'}}>
            <span style={{position:'absolute',left:10,top:'50%',transform:'translateY(-50%)',color:'var(--t3)'}}><Ic.User s={15}/></span>
            <input style={{paddingLeft:34}} value={form.username} onChange={e=>upd('username',e.target.value)} placeholder="Seu nome de usuário" onKeyDown={e=>e.key==='Enter'&&(tab==='entrar'?handleLogin():handleRegister())}/>
          </div>
        </div>
        <div className="login-field">
          <label>Senha</label>
          <div style={{position:'relative'}}>
            <span style={{position:'absolute',left:10,top:'50%',transform:'translateY(-50%)',color:'var(--t3)'}}><Ic.Lock s={15}/></span>
            <input style={{paddingLeft:34,paddingRight:36}} type={showPw?'text':'password'} value={form.password} onChange={e=>upd('password',e.target.value)} placeholder="Sua senha" onKeyDown={e=>e.key==='Enter'&&(tab==='entrar'?handleLogin():handleRegister())}/>
            <button onClick={()=>setShowPw(p=>!p)} style={{position:'absolute',right:10,top:'50%',transform:'translateY(-50%)',color:'var(--t3)',cursor:'pointer'}}>{showPw?<Ic.EyeOff s={15}/>:<Ic.Eye s={15}/>}</button>
          </div>
        </div>
        {tab==='criar'&&(
          <div className="login-field">
            <label>Confirmar Senha</label>
            <div style={{position:'relative'}}>
              <span style={{position:'absolute',left:10,top:'50%',transform:'translateY(-50%)',color:'var(--t3)'}}><Ic.Lock s={15}/></span>
              <input style={{paddingLeft:34}} type={showPw?'text':'password'} value={form.confirm} onChange={e=>upd('confirm',e.target.value)} placeholder="Repita a senha" onKeyDown={e=>e.key==='Enter'&&handleRegister()}/>
            </div>
          </div>
        )}
        {err&&<div className="login-err">{err}</div>}
        <button className="btn btn-primary" style={{width:'100%',justifyContent:'center',padding:'11px',marginTop:4}} onClick={tab==='entrar'?handleLogin:handleRegister}>
          {tab==='entrar'?'Entrar':'Criar conta'}
        </button>
      </div>
    </div>
  );
}

/* ─────────── CALENDARIO MENSAL ─────────── */
function CalMensal({ano,mes,eventos,diaAtivo,onDiaClick}){
  const fim=daysInMonth(ano,mes);const ini=firstDow(ano,mes);
  const cells=[];const todayYMD=toYMD(today());
  for(let i=0;i<ini;i++)cells.push({date:new Date(ano,mes,1-ini+i),outro:true});
  for(let d=1;d<=fim;d++)cells.push({date:new Date(ano,mes,d),outro:false});
  const rem=(7-cells.length%7)%7;
  for(let i=1;i<=rem;i++)cells.push({date:new Date(ano,mes+1,i),outro:true});
  return(
    <div style={{flex:1,overflow:'auto',padding:'0 20px 20px'}}>
      <div className="month-grid">
        {DIAS.map(d=><div key={d} className="month-dow">{d}</div>)}
        {cells.map((cell,i)=>{
          const ymd=toYMD(cell.date);
          const evs=getEvForDate(eventos,ymd);
          const isToday=ymd===todayYMD;const isSel=ymd===diaAtivo;
          return(
            <div key={i} className={`month-day${cell.outro?' other-month':''}${isSel?' selected':''}`} onClick={()=>onDiaClick(ymd)}>
              <div className="day-num" style={isToday?{background:'var(--accent)',color:'#fff'}:{}}>
                {cell.date.getDate()}
              </div>
              {evs.slice(0,3).map(ev=>(
                <div key={ev.id} className="ev-pill" style={{background:hex2rgba(ev.cor,0.2),color:ev.cor}}>
                  {ev.horaInicio} {ev.titulo}
                </div>
              ))}
              {evs.length>3&&<div style={{fontSize:9,color:'var(--t3)',marginTop:2}}>+{evs.length-3}</div>}
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ─────────── CALENDARIO SEMANAL ─────────── */
function CalSemanal({dataRef,eventos,onEventoClick}){
  const ini=new Date(dataRef);ini.setDate(dataRef.getDate()-dataRef.getDay());
  const dias=Array.from({length:7},(_,i)=>addDays(ini,i));
  const horas=Array.from({length:24},(_,i)=>i);
  const todayYMD=toYMD(today());
  const cols=`60px repeat(7,1fr)`;
  return(
    <div className="week-wrap">
      <div style={{display:'grid',gridTemplateColumns:cols,minWidth:580}}>
        <div style={{height:50,borderBottom:'1px solid var(--border)',position:'sticky',top:0,background:'var(--surface)',zIndex:10}}/>
        {dias.map((d,i)=>{
          const ymd=toYMD(d);const isT=ymd===todayYMD;
          return(
            <div key={i} style={{height:50,borderBottom:'1px solid var(--border2)',borderLeft:'1px solid var(--border)',position:'sticky',top:0,background:'var(--surface)',zIndex:10,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center'}}>
              <span style={{fontSize:10,color:'var(--t3)',textTransform:'uppercase',fontWeight:600}}>{DIAS[d.getDay()]}</span>
              <div style={{width:26,height:26,borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',background:isT?'var(--accent)':'transparent',color:isT?'#fff':'var(--t1)',fontWeight:600,fontSize:13,marginTop:2}}>{d.getDate()}</div>
            </div>
          );
        })}
        {horas.map(h=>(
          <React.Fragment key={h}>
            <div className="week-time-cell">{String(h).padStart(2,'0')}:00</div>
            {dias.map((d,di)=>{
              const ymd=toYMD(d);
              const evs=getEvForDate(eventos,ymd).filter(ev=>Math.floor(toMins(ev.horaInicio)/60)===h);
              return(
                <div key={di} className="week-day-cell">
                  {evs.map(ev=>{
                    const top=(toMins(ev.horaInicio)%60)/60*52;
                    const dur=Math.max(20,toMins(ev.horaFim)-toMins(ev.horaInicio));
                    const height=Math.min((dur/60)*52,200);
                    return(
                      <div key={ev.id} className="week-ev" onClick={()=>onEventoClick(ev)}
                        style={{top,height,background:hex2rgba(ev.cor,0.2),borderLeft:`3px solid ${ev.cor}`,color:ev.cor}}>
                        {ev.titulo}
                      </div>
                    );
                  })}
                </div>
              );
            })}
          </React.Fragment>
        ))}
      </div>
    </div>
  );
}

/* ─────────── CALENDARIO DIARIO ─────────── */
function CalDiario({data,eventos,onEventoClick}){
  const ymd=toYMD(data);const evs=getEvForDate(eventos,ymd);
  const horas=Array.from({length:24},(_,i)=>i);
  const isToday=ymd===toYMD(today());
  const [nowMins,setNowMins]=useState(toMins(nowTime()));
  const lineRef=useRef(null);
  useEffect(()=>{const iv=setInterval(()=>setNowMins(toMins(nowTime())),60000);return()=>clearInterval(iv);},[]);
  useEffect(()=>{if(isToday&&lineRef.current)lineRef.current.scrollIntoView({block:'center'});},[isToday]);
  return(
    <div style={{flex:1,overflow:'auto',padding:'0 20px 20px'}}>
      {horas.map(h=>{
        const hEvs=evs.filter(ev=>Math.floor(toMins(ev.horaInicio)/60)===h);
        const showLine=isToday&&Math.floor(nowMins/60)===h;
        const lineTop=showLine?(nowMins%60)/60*52:null;
        return(
          <div key={h} style={{display:'flex',minHeight:52,borderBottom:'1px solid var(--border)'}}>
            <div style={{width:58,flexShrink:0,padding:'4px 10px 0',fontSize:10,color:'var(--t3)',fontWeight:500}}>{String(h).padStart(2,'0')}:00</div>
            <div style={{flex:1,padding:'2px 8px',position:'relative',minHeight:52}}>
              {lineTop!==null&&(
                <div ref={lineRef} style={{position:'absolute',left:0,right:0,top:lineTop,height:2,background:'var(--red)',zIndex:5}}>
                  <div style={{width:8,height:8,background:'var(--red)',borderRadius:'50%',position:'absolute',left:-4,top:-3,animation:'pulseDot 1.5s infinite'}}/>
                </div>
              )}
              {hEvs.map(ev=>(
                <div key={ev.id} onClick={()=>onEventoClick(ev)}
                  style={{borderRadius:9,padding:'6px 10px',marginBottom:4,cursor:'pointer',background:hex2rgba(ev.cor,0.14),borderLeft:`3px solid ${ev.cor}`}}>
                  <div style={{display:'flex',gap:8,alignItems:'center'}}>
                    <span style={{fontSize:10,color:ev.cor,fontWeight:600,fontVariantNumeric:'tabular-nums'}}>{ev.horaInicio}–{ev.horaFim}</span>
                    <span style={{fontSize:13,fontWeight:600}}>{ev.titulo}</span>
                  </div>
                  {ev.local&&<div style={{fontSize:11,color:'var(--t2)',marginTop:2}}>{ev.local}</div>}
                </div>
              ))}
            </div>
          </div>
        );
      })}
    </div>
  );
}

  const handleMarcar=(id,val)=>{
    const evs=eventos.map(e=>e.id===id?{...e,realizado:val}:e);

  const fixos=eventos.filter(e=>e.fixo&&e.recorrencia!=='nenhuma');
  const calTitle=vis==='mes'?`${MESES[mes]} ${ano}`:vis==='semana'?`Semana de ${fmtShort(refDate)}`:fmtDate(refDate);

            <button className="btn btn-ghost btn-sm" onClick={gg.connect}
              style={{gap:5,color:'#4285F4',borderColor:'rgba(66,133,244,.25)',background:'rgba(66,133,244,.07)',flexShrink:0}}>

        <button className="btn btn-primary btn-sm" onClick={()=>setModalEv({ev:null,data:toYMD(today())})}>
          <Ic.Plus s={14}/> Novo Evento

      </div>
      <div style={{flex:1,display:'flex',overflow:'hidden'}}>
        <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}}>

          {vis==='semana'&&<CalSemanal dataRef={refDate} eventos={eventos} onEventoClick={ev=>setModalEv({ev,data:ev.dataInicio})}/>}
          {vis==='dia'&&<CalDiario data={refDate} eventos={eventos} onEventoClick={ev=>setModalEv({ev,data:ev.dataInicio})}/>}
          {fixos.length>0&&(
            <div style={{padding:'12px 20px',borderTop:'1px solid var(--border)',flexShrink:0}}>
              <div className="section-title" style={{marginBottom:8}}>Eventos Fixos</div>

                  const cat=catEv(ev.categoria);

/* ─────────── TIMELINE COMPARTILHADA ─────────── */
function TimelineView({data,blocos,eventos,readOnly,onAddBloco,onToggle,onEdit,onDelete,onTogglePin}){
  const ymd=toYMD(data);
  const isToday=ymd===toYMD(today());
  const [nowMins,setNowMins]=useState(toMins(nowTime()));
  const lineRef=useRef(null);
  useEffect(()=>{const iv=setInterval(()=>setNowMins(toMins(nowTime())),60000);return()=>clearInterval(iv);},[]);
  useEffect(()=>{if(isToday&&lineRef.current)lineRef.current.scrollIntoView({block:'center'});},[isToday]);

  const agEvs=getEvForDate(eventos,ymd);
  const START=5*60;const END=23*60;
  const slots=[];for(let m=START;m<END;m+=30)slots.push(m);

  const getBlocos=(s)=>blocos.filter(b=>toMins(b.horaInicio)>=s&&toMins(b.horaInicio)<s+30);
  const getAg=(s)=>agEvs.filter(ev=>toMins(ev.horaInicio)>=s&&toMins(ev.horaInicio)<s+30);
  const isOcupado=(s)=>[...blocos,...agEvs].some(b=>s>=toMins(b.horaInicio)&&s<toMins(b.horaFim));

  return(
    <div className="tl-wrap">
      {slots.map((slotMins)=>{
        const bls=getBlocos(slotMins);const agBls=getAg(slotMins);
        const occupied=isOcupado(slotMins);
        const showTime=slotMins%60===0;
        const showLine=isToday&&Math.abs(nowMins-slotMins)<30;
        const lineOff=isToday?Math.max(0,Math.min(1,(nowMins-slotMins)/30)):null;
        return(
          <div key={slotMins} className="tl-row">
            <div className="tl-time" style={{opacity:showTime?1:0}}>{toHM(slotMins)}</div>
            <div className="tl-rail"/>
            <div className="tl-col" style={{position:'relative'}}>
              {showLine&&(
                <div ref={lineRef} style={{position:'absolute',left:0,right:0,top:`${lineOff*100}%`,height:2,background:'var(--red)',zIndex:5,pointerEvents:'none'}}>
                  <div style={{width:8,height:8,background:'var(--red)',borderRadius:'50%',position:'absolute',left:-4,top:-3,animation:'pulseDot 1.5s infinite'}}/>
                </div>
              )}
              {agBls.map(ev=>(
                <div key={ev.id} className="tl-agenda-block" style={{background:hex2rgba(ev.cor,0.1),borderLeft:`3px solid ${ev.cor}`}}>
                  <div style={{display:'flex',alignItems:'center',gap:8}}>
                    <Ic.Calendar s={11} c={ev.cor}/>
                    <span style={{fontSize:10,color:ev.cor,fontWeight:600}}>{ev.horaInicio}–{ev.horaFim}</span>
                    <span style={{fontSize:12,fontWeight:600}}>{ev.titulo}</span>
                    <span style={{fontSize:9,color:'var(--t3)',marginLeft:'auto'}}>Agenda</span>
                  </div>
                </div>
              ))}
              {bls.map(b=>{
                const cat=catRot(b.categoria);
                const passado=isToday&&toMins(b.horaFim)<nowMins;
                const emAnd=isToday&&toMins(b.horaInicio)<=nowMins&&toMins(b.horaFim)>nowMins;
                return(
                  <div key={b.id} className={`tl-block ${b.concluido?'done':''} ${passado&&!b.concluido?'late':''} ${emAnd&&!b.concluido?'current':''}`}
                    style={{background:hex2rgba(b.cor,0.13),borderLeft:`3px solid ${b.cor}`}}>
                    <div style={{display:'flex',alignItems:'center',gap:7}}>
                      <span style={{fontSize:14}}>{cat.icon}</span>
                      <div style={{flex:1}}>
                        <div style={{display:'flex',alignItems:'center',gap:6}}>
                          <span style={{fontSize:12,fontWeight:600}}>{b.titulo}</span>
                          {b.fixo&&<span className="tl-pin-badge"><Ic.Pin s={9} c='var(--amber)'/> Fixo</span>}
                          {emAnd&&!b.concluido&&<span style={{fontSize:9,color:'var(--accent)',fontWeight:600,animation:'blink 1.5s infinite'}}>● AGORA</span>}
                        </div>
                        <span style={{fontSize:10,color:'var(--t3)',fontVariantNumeric:'tabular-nums'}}>{b.horaInicio}–{b.horaFim}</span>
                        {b.observacao&&<div style={{fontSize:10,color:'var(--t2)',marginTop:1}}>{b.observacao}</div>}
                      </div>
                      {!readOnly&&(
                        <div style={{display:'flex',gap:3,flexShrink:0}}>
                          {!b.concluido?<button className="btn-icon" style={{width:26,height:26}} title="Concluir" onClick={()=>onToggle(b.id,true)}><Ic.Check s={13} c='var(--green)'/></button>
                            :<button className="btn-icon" style={{width:26,height:26}} title="Desfazer" onClick={()=>onToggle(b.id,false)}><Ic.Undo s={13} c='var(--t2)'/></button>}
                          <button className="btn-icon" style={{width:26,height:26}} title={b.fixo?'Desafixar':'Fixar'} onClick={()=>onTogglePin(b)}>
                            {b.fixo?<Ic.Unpin s={13} c='var(--amber)'/>:<Ic.Pin s={13} c='var(--t3)'/>}
                          </button>
                          <button className="btn-icon" style={{width:26,height:26}} onClick={()=>onEdit(b)}><Ic.Edit s={12}/></button>
                          <button className="btn-icon" style={{width:26,height:26}} onClick={()=>onDelete(b.id)}><Ic.Trash s={12}/></button>
                        </div>
                      )}
                    </div>
                  </div>
                );
              })}
              {!occupied&&bls.length===0&&agBls.length===0&&showTime&&!readOnly&&(
                <div className="tl-slot-empty" onClick={()=>onAddBloco(toHM(slotMins))}>
                  <Ic.Plus s={13}/><span>Adicionar bloco</span>
                </div>
              )}
            </div>
          </div>
        );
      })}
    </div>
  );
}

/* ─────────── RESUMO DIA ─────────── */
function ResumoDia({blocos,agEvs}){
  const todos=[...blocos,...agEvs];
  const totalMins=todos.reduce((a,b)=>a+(toMins(b.horaFim)-toMins(b.horaInicio)),0);
  const conclMins=blocos.filter(b=>b.concluido).reduce((a,b)=>a+(toMins(b.horaFim)-toMins(b.horaInicio)),0);
  const pct=totalMins>0?Math.round((conclMins/totalMins)*100):0;
  const byCat={};
  blocos.forEach(b=>{if(!byCat[b.categoria])byCat[b.categoria]=0;byCat[b.categoria]+=toMins(b.horaFim)-toMins(b.horaInicio);});
  const h=Math.floor(totalMins/60);const m=totalMins%60;
  return(
    <div style={{marginBottom:14}}>
      <div style={{display:'flex',gap:10,marginBottom:12}}>
        <div style={{flex:1,background:'var(--surf2)',borderRadius:11,padding:'11px 13px',border:'1px solid var(--border)'}}>
          <div style={{fontSize:10,color:'var(--t2)',marginBottom:2}}>Total planejado</div>
          <div style={{fontFamily:'Syne',fontWeight:800,fontSize:18}}>{h}h {m}min</div>
        </div>
        <div style={{flex:1,background:'var(--surf2)',borderRadius:11,padding:'11px 13px',border:'1px solid var(--border)'}}>
          <div style={{fontSize:10,color:'var(--t2)',marginBottom:2}}>Concluído</div>
          <div style={{fontFamily:'Syne',fontWeight:800,fontSize:18,color:'var(--green)'}}>{pct}%</div>
          <div className="progress-bar" style={{marginTop:5}}>
            <div className="progress-fill" style={{width:`${pct}%`,background:'var(--green)'}}/>
          </div>
        </div>
      </div>
      {Object.keys(byCat).length>0&&(
        <>
          <div className="section-title">Por categoria</div>
          {Object.entries(byCat).slice(0,4).map(([cid,mins])=>{
            const cat=catRot(cid);const pctC=totalMins>0?Math.round((mins/totalMins)*100):0;
            return(
              <div key={cid} className="summary-bar-row">
                <div className="summary-bar-label">{cat.icon} {cat.label}</div>
                <div className="summary-bar-track"><div className="summary-bar-fill" style={{width:`${pctC}%`,background:cat.cor}}/></div>
                <div className="summary-bar-val">{Math.floor(mins/60)}h{mins%60>0?`${mins%60}m`:''}</div>
              </div>
            );
          })}
        </>
      )}
    </div>
  );
}

/* ─────────── ABA PLANEJAR ─────────── */
function PlanejaDiaTab({eventos,planos,pinnedBlocos,onSavePlano,onSavePinned}){
  const amanha=tomorrow();const ymdAmanha=toYMD(amanha);
  const [planDate,setPlanDate]=useState(ymdAmanha);
  const plano=planos[planDate]||{blocos:[],notas:''};
  const [notas,setNotas]=useState(plano.notas||'');
  const [blocos,setBlocos]=useState([]);
  const [modalBloco,setModalBloco]=useState(null);
  const [saved,setSaved]=useState(false);

  useEffect(()=>{
    const p=planos[planDate]||{blocos:[],notas:''};
    // merge pinned blocks if not already in plan
    const pinMerged=[...pinnedBlocos].filter(pb=>!p.blocos.some(b=>b.id===pb.id));
    setBlocos([...p.blocos,...pinMerged.map(pb=>({...pb,id:uid(),fixo:true}))]);
    setNotas(p.notas||'');setSaved(false);
  },[planDate,planos,pinnedBlocos]);

  const agEvs=getEvForDate(eventos,planDate);
  const planDateObj=fromYMD(planDate);
  const temPlano=!!planos[planDate];
  const fixosBlocos=blocos.filter(b=>b.fixo);

  const handleAddBloco=(hora)=>setModalBloco({bloco:null,hora});
  const handleEditBloco=(b)=>setModalBloco({bloco:b,hora:b.horaInicio});
  const handleSaveBloco=(b)=>{
    const novos=blocos.some(x=>x.id===b.id)?blocos.map(x=>x.id===b.id?b:x):[...blocos,b];
    setBlocos(novos);
    if(b.fixo){
      // add/update in global pinned
      const pins=pinnedBlocos.some(p=>p.id===b.id)?pinnedBlocos.map(p=>p.id===b.id?b:p):[...pinnedBlocos,b];
      onSavePinned(pins);
    }
    setModalBloco(null);setSaved(false);
  };
  const handleDeleteBloco=(id)=>{setBlocos(p=>p.filter(b=>b.id!==id));setSaved(false);};
  const handleToggle=(id,val)=>{setBlocos(p=>p.map(b=>b.id===id?{...b,concluido:val,concluidoEm:val?new Date().toISOString():null}:b));setSaved(false);};
  const handleTogglePin=(bloco)=>{
    if(bloco.fixo){
      // unpin
      const novos=blocos.map(b=>b.id===bloco.id?{...b,fixo:false}:b);
      setBlocos(novos);
      onSavePinned(pinnedBlocos.filter(p=>p.id!==bloco.id));
    } else {
      // pin
      const novo={...bloco,fixo:true};
      const novos=blocos.map(b=>b.id===bloco.id?novo:b);
      setBlocos(novos);
      onSavePinned([...pinnedBlocos,novo]);
    }
    setSaved(false);
  };

  const handleSave=()=>{
    const now=new Date().toISOString();
    const total=blocos.length+agEvs.length;const conc=blocos.filter(b=>b.concluido).length;
    onSavePlano(planDate,{data:planDate,blocos,notas,criadoEm:plano.criadoEm||now,atualizadoEm:now,resumo:{totalBlocos:total,concluidos:conc,percentual:total>0?Math.round((conc/total)*100):0}});
    setSaved(true);setTimeout(()=>setSaved(false),3000);
  };
  const navDate=(d)=>{const dt=fromYMD(planDate);dt.setDate(dt.getDate()+d);setPlanDate(toYMD(dt));};

  return(
    <div className="fade-in" style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}}>
      <div style={{padding:'14px 22px',borderBottom:'1px solid var(--border)',flexShrink:0}}>
        <div style={{display:'flex',alignItems:'center',gap:12,flexWrap:'wrap'}}>
          <div>
            <div style={{fontSize:10,color:'var(--t2)',fontWeight:600,textTransform:'uppercase',letterSpacing:'.5px',marginBottom:2}}>Planejando</div>
            <div style={{fontFamily:'Syne',fontWeight:700,fontSize:18}}>{fmtDate(planDateObj)}</div>
          </div>
          {temPlano&&<span className="badge badge-blue"><Ic.Edit s={10}/> Editando plano</span>}
          <div style={{marginLeft:'auto',display:'flex',gap:6,alignItems:'center'}}>
            <button className="btn btn-ghost btn-sm" onClick={()=>navDate(-1)}><Ic.ChevL s={14}/></button>
            <button className="btn btn-ghost btn-sm" onClick={()=>setPlanDate(ymdAmanha)}>Amanhã</button>
            <button className="btn btn-ghost btn-sm" onClick={()=>navDate(1)}><Ic.ChevR s={14}/></button>
            <input type="date" value={planDate} onChange={e=>setPlanDate(e.target.value)} style={{width:145,fontSize:12,padding:'5px 10px'}}/>
          </div>
        </div>
      </div>
      <div style={{flex:1,overflow:'hidden',display:'flex'}}>
        {/* Timeline */}
        <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden',padding:'14px 16px 14px 22px'}}>
          {/* Pinned fixos banner */}
          {fixosBlocos.length>0&&(
            <div className="pinned-section">
              <div className="pinned-header"><Ic.Pin s={13} c='var(--amber)'/> Atividades fixas no plano ({fixosBlocos.length})</div>
              <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
                {fixosBlocos.map(b=>{
                  const cat=catRot(b.categoria);
                  return(
                    <div key={b.id} style={{display:'flex',alignItems:'center',gap:6,padding:'5px 10px',background:hex2rgba(b.cor,0.15),borderRadius:8,border:`1px solid ${hex2rgba(b.cor,0.25)}`}}>
                      <span style={{fontSize:12}}>{cat.icon}</span>
                      <span style={{fontSize:11,fontWeight:500}}>{b.titulo}</span>
                      <span style={{fontSize:10,color:'var(--t3)'}}>{b.horaInicio}</span>
                    </div>
                  );
                })}
              </div>
            </div>
          )}
          {/* Agenda card */}
          {agEvs.length>0?(
            <div style={{marginBottom:12,background:'rgba(34,197,94,.05)',border:'1px solid rgba(34,197,94,.18)',borderRadius:12,padding:'11px 14px',flexShrink:0}}>
              <div style={{fontSize:11,fontWeight:600,color:'var(--accent)',marginBottom:7,display:'flex',alignItems:'center',gap:5}}><Ic.Calendar s={12} c='var(--accent)'/> Já agendado ({agEvs.length})</div>
              {agEvs.map(ev=>(
                <div key={ev.id} style={{display:'flex',alignItems:'center',gap:8,marginBottom:3}}>
                  <div style={{width:3,height:18,borderRadius:99,background:ev.cor,flexShrink:0}}/>
                  <span style={{fontSize:10,color:'var(--t3)',width:76,fontVariantNumeric:'tabular-nums'}}>{ev.horaInicio}–{ev.horaFim}</span>
                  <span style={{fontSize:12,fontWeight:500}}>{ev.titulo}</span>
                </div>
              ))}
            </div>
          ):(
            <div style={{marginBottom:12,padding:'8px 14px',background:'rgba(34,197,94,.05)',border:'1px solid rgba(34,197,94,.15)',borderRadius:10,fontSize:12,color:'var(--green)',flexShrink:0,display:'flex',alignItems:'center',gap:6}}>
              <Ic.Check s={13}/> Nenhum compromisso agendado
            </div>
          )}
          <TimelineView data={planDateObj} blocos={blocos} eventos={eventos}
            onAddBloco={handleAddBloco} onEdit={handleEditBloco} onDelete={handleDeleteBloco}
            onToggle={handleToggle} onTogglePin={handleTogglePin}/>
        </div>
        {/* Side */}
        <div style={{width:270,flexShrink:0,borderLeft:'1px solid var(--border)',padding:'16px 18px',overflowY:'auto',display:'flex',flexDirection:'column',gap:14}}>
          <ResumoDia blocos={blocos} agEvs={agEvs}/>
          <div>
            <div className="section-title">Intenção do dia</div>
            <textarea rows={5} value={notas} onChange={e=>{setNotas(e.target.value);setSaved(false);}} placeholder="Metas, pensamentos, lembretes..."/>
          </div>
          <button className="btn btn-primary" style={{width:'100%',justifyContent:'center',padding:'10px'}} onClick={handleSave}>
            {saved?<><Ic.Check s={14}/>Salvo!</>:<><Ic.Check s={14}/>Salvar Plano</>}
          </button>
        </div>
      </div>
      {modalBloco&&<BlocoModal bloco={modalBloco.bloco} data={planDate} horaDefault={modalBloco.hora} onSave={handleSaveBloco} onClose={()=>setModalBloco(null)}/>}
    </div>
  );
}

/* ─────────── COUNTDOWN ─────────── */
function Countdown({targetTime}){
  const [diff,setDiff]=useState(0);
  useEffect(()=>{
    const calc=()=>{const now=new Date();const[h,m]=targetTime.split(':').map(Number);const t=new Date(now.getFullYear(),now.getMonth(),now.getDate(),h,m);setDiff(Math.max(0,Math.floor((t-now)/1000)));};
    calc();const iv=setInterval(calc,1000);return()=>clearInterval(iv);
  },[targetTime]);
  if(diff===0)return<span style={{color:'var(--green)'}}>Agora!</span>;
  const h=Math.floor(diff/3600);const m=Math.floor((diff%3600)/60);const s=diff%60;
  return<span>{h>0&&`${h}h `}{m>0&&`${m}min `}{h===0&&`${String(s).padStart(2,'0')}s`}</span>;
}

/* ─────────── ABA MEU DIA ─────────── */
function MeuDiaTab({eventos,planos,pinnedBlocos,onSavePlano,onGoPlanejar}){
  const todayYMD=toYMD(today());
  const plano=planos[todayYMD]||{blocos:[],notas:''};
  const [blocos,setBlocos]=useState([]);
  const [clock,setClock]=useState(nowTime());
  const hora=parseInt(clock.split(':')[0]);

  useEffect(()=>{
    const p=planos[todayYMD]||{blocos:[]};
    const pinMerged=pinnedBlocos.filter(pb=>!p.blocos.some(b=>b.id===pb.id));
    setBlocos([...p.blocos,...pinMerged.map(pb=>({...pb,id:uid(),fixo:true}))]);
  },[planos,todayYMD,pinnedBlocos]);

// SVG Donut Chart
function DonutChart({data,size=160}){
  const total=data.reduce((s,d)=>s+d.value,0);
  if(total===0)return(
    <div style={{width:size,height:size,display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',color:'var(--t3)'}}>
      <Ic.Target s={32} c='var(--t3)'/>
      <div style={{fontSize:11,marginTop:6}}>Sem dados</div>
    </div>
  );
  const cx=size/2,cy=size/2,r=size/2-16,ir=r*0.56;
  const toXY=(angle)=>{const rad=angle*Math.PI/180;return {x:cx+r*Math.cos(rad),y:cy+r*Math.sin(rad)};};
  const toXYi=(angle)=>{const rad=angle*Math.PI/180;return {x:cx+ir*Math.cos(rad),y:cy+ir*Math.sin(rad)};};
  let cur=-90;
  const segs=data.filter(d=>d.value>0).map(d=>{
    const ang=(d.value/total)*360;
    const seg={...d,s:cur,e:cur+ang};cur+=ang;return seg;
  });
  const arc=(s,e)=>{
    const p1=toXY(s),p2=toXY(e),p3=toXYi(e),p4=toXYi(s);
    const lg=e-s>180?1:0;
    return `M${p1.x},${p1.y} A${r},${r} 0 ${lg} 1 ${p2.x},${p2.y} L${p3.x},${p3.y} A${ir},${ir} 0 ${lg} 0 ${p4.x},${p4.y} Z`;
  };
  const hTotal=Math.floor(total/60),mTotal=total%60;
  return(
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      {segs.map((seg,i)=>(
        <path key={i} d={arc(seg.s,seg.e)} fill={seg.color} opacity={.88}/>
      ))}
      <text x={cx} y={cy-7} textAnchor="middle" fill="#F0FFF4" fontSize="18" fontWeight="800" fontFamily="Syne,sans-serif">
        {hTotal>0?`${hTotal}h`:''}{mTotal>0&&hTotal===0?`${mTotal}m`:''}
      </text>
      <text x={cx} y={cy+10} textAnchor="middle" fill="#7A9A82" fontSize="9">planejadas</text>
    </svg>
  );
}

// SVG Bar Chart
function BarChart({data,height=120,accent='#22C55E'}){
  if(!data||data.length===0)return<div style={{height,display:'flex',alignItems:'center',justifyContent:'center',color:'var(--t3)',fontSize:12}}>Sem dados</div>;
  const max=Math.max(...data.map(d=>d.value),1);
  const bw=Math.max(16,Math.floor(280/data.length)-6);
  const gap=Math.max(4,Math.floor(50/data.length));
  const totalW=data.length*(bw+gap);
  return(
    <svg width="100%" height={height} viewBox={`0 0 ${totalW} ${height}`} preserveAspectRatio="xMidYMid meet" style={{display:'block'}}>
      {data.map((d,i)=>{
        const barH=Math.max(2,(d.value/max)*(height-28));
        const x=i*(bw+gap);const y=height-20-barH;
        const col=d.color||accent;
        return(
          <g key={i}>
            <rect x={x} y={y} width={bw} height={barH} rx={4} fill={col} opacity={.85}/>
            {d.value>0&&<text x={x+bw/2} y={y-3} textAnchor="middle" fill={col} fontSize="8" fontWeight="600">{d.value>=60?`${Math.floor(d.value/60)}h`:`${d.value}m`}</text>}
            <text x={x+bw/2} y={height-5} textAnchor="middle" fill="#3A5240" fontSize="8">{d.label}</text>
          </g>
        );
      })}
    </svg>
  );
}

// Mini line sparkline
function Sparkline({data,width=120,height=36,color='#22C55E'}){
  if(!data||data.length<2)return null;
  const max=Math.max(...data,1);
  const pts=data.map((v,i)=>{
    const x=(i/(data.length-1))*(width-4)+2;
    const y=height-2-(v/max)*(height-6);
    return `${x},${y}`;
  }).join(' ');
  return(
    <svg width={width} height={height} viewBox={`0 0 ${width} ${height}`}>
      <polyline points={pts} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
      <polyline points={`2,${height} ${pts} ${width-2},${height}`} fill={color} opacity=".12" strokeWidth="0"/>
    </svg>
  );
}

// Data helpers for dashboard
function getDashData(planos,eventos,period){
  const now=new Date();
  const todayStr=toYMD(today());

  const filterKey=(k)=>{
    if(period==='geral')return true;
    if(period==='dia')return k===todayStr;
    if(period==='semana'){
      const start=new Date(today());start.setDate(start.getDate()-start.getDay());
      const end=addDays(start,6);
      return k>=toYMD(start)&&k<=toYMD(end);
    }
    if(period==='mes'){
      const ym=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
      return k.startsWith(ym);
    }
    return true;
  };

  const keys=Object.keys(planos).filter(filterKey).sort();
  const allBlocos=keys.flatMap(k=>planos[k].blocos||[]);

  // cat stats
  const catMap={};
  allBlocos.forEach(b=>{
    if(!catMap[b.categoria])catMap[b.categoria]={mins:0,count:0,done:0,cor:b.cor};
    const m=toMins(b.horaFim)-toMins(b.horaInicio);
    catMap[b.categoria].mins+=Math.max(0,m);
    catMap[b.categoria].count++;
    if(b.concluido)catMap[b.categoria].done++;
  });

  // activity ranking
  const actMap={};
  allBlocos.forEach(b=>{
    const k=b.titulo.trim().toLowerCase();
    if(!actMap[k])actMap[k]={titulo:b.titulo,mins:0,count:0,done:0,cor:b.cor};
    actMap[k].mins+=Math.max(0,toMins(b.horaFim)-toMins(b.horaInicio));
    actMap[k].count++;
    if(b.concluido)actMap[k].done++;
  });

  // daily bars
  const dailyMap={};
  keys.forEach(k=>{
    const bs=planos[k].blocos||[];
    dailyMap[k]={mins:bs.reduce((s,b)=>s+Math.max(0,toMins(b.horaFim)-toMins(b.horaInicio)),0),done:bs.filter(b=>b.concluido).length,total:bs.length};
  });

  const totalMins=allBlocos.reduce((s,b)=>s+Math.max(0,toMins(b.horaFim)-toMins(b.horaInicio)),0);
  const totalDone=allBlocos.filter(b=>b.concluido).length;
  const diasPlanejados=keys.length;
  const pct=allBlocos.length>0?Math.round((totalDone/allBlocos.length)*100):0;

  // best day
  const bestDay=Object.entries(dailyMap).sort((a,b)=>(b[1].total>0?b[1].done/b[1].total:0)-(a[1].total>0?a[1].done/a[1].total:0))[0];

  // agenda events for period
  const agEvs=[];
  keys.forEach(k=>{agEvs.push(...getEvForDate(eventos,k));});
  const agCatMap={};
  agEvs.forEach(ev=>{
    if(!agCatMap[ev.categoria])agCatMap[ev.categoria]={mins:0,count:0,cor:ev.cor};
    agCatMap[ev.categoria].mins+=Math.max(0,toMins(ev.horaFim)-toMins(ev.horaInicio));
    agCatMap[ev.categoria].count++;
  });

  return{catMap,actMap,dailyMap,totalMins,totalDone,diasPlanejados,pct,bestDay,agCatMap,allBlocos,keys};
}

function MetaItem({meta,onToggle,onDelete,onEdit,onUpdateQtd}){

  const pctQtd=Math.min(100,Math.round((atual/alvo)*100));
  const concluida=isQtd?atual>=alvo:meta.concluido;

  return(
    <div className={`meta-item ${concluida?'done':''}`}>
      <div className={`meta-check ${concluida?'done':''}`}
        onClick={()=>!isQtd&&onToggle(meta.id)}

          {isQtd&&<span style={{fontSize:10,color:'var(--t3)',background:'var(--surf2)',border:'1px solid var(--border)',borderRadius:5,padding:'1px 6px'}}>#</span>}
        </div>

        {isQtd&&!concluida&&(
          <>
            <div className="meta-qtd-bar">
              <div className="meta-qtd-fill" style={{width:`${pctQtd}%`,background:pctQtd>=100?'var(--accent)':pctQtd>=50?'#F59E0B':prio.cor}}/>
            </div>

              <button className="meta-qtd-btn" disabled={atual<=0} onClick={e=>{e.stopPropagation();onUpdateQtd(meta.id,-1);}}>−</button>
              <span style={{fontSize:13,fontWeight:700,minWidth:18,textAlign:'center'}}>{atual}</span>

function MetaSection({titulo,cor,icone,periodo,metas,onToggle,onDelete,onEdit,onUpdateQtd}){
  const minhas=metas.filter(m=>m.periodo===periodo);
  const isConcluida=m=>m.tipo==='quantidade'?(m.atual||0)>=(m.metaQtd||1):m.concluido;
  const feitas=minhas.filter(isConcluida).length;
  const pct=minhas.length>0?Math.round((feitas/minhas.length)*100):0;
  const pendentes=minhas.filter(m=>!isConcluida(m));
  const concluidas=minhas.filter(isConcluida);
  const [showDone,setShowDone]=useState(false);

  return(
    <div className="meta-section">
      {/* Header */}
      <div className="meta-section-header">
        <div className="meta-section-title" style={{color:cor}}>{icone}<span>{titulo}</span></div>
        {minhas.length>0&&(
          <span style={{fontSize:11,color:'var(--t2)',background:'var(--surf2)',borderRadius:6,padding:'2px 8px',border:'1px solid var(--border)'}}>
            {feitas}/{minhas.length}
          </span>
        )}
      </div>

      {/* Progress bar */}
      {minhas.length>0&&(
        <div style={{marginBottom:12}}>
          <div style={{display:'flex',justifyContent:'space-between',fontSize:10,color:'var(--t3)',marginBottom:4}}>
            <span style={{color:pct===100?cor:'var(--t3)',fontWeight:pct===100?700:400}}>
              {pct===100?'Tudo concluído! 🎉':`${pct}% concluído`}
            </span>
            {pendentes.length>0&&<span>{pendentes.length} pendente{pendentes.length!==1?'s':''}</span>}
          </div>
          <div className="progress-bar" style={{height:5}}>
            <div className="progress-fill" style={{width:`${pct}%`,background:cor}}/>
          </div>
        </div>
      )}

      {/* Lista pendentes */}
      {pendentes.length===0&&concluidas.length===0?(
        <div style={{textAlign:'center',padding:'28px 0',color:'var(--t3)',fontSize:12}}>
          <div style={{width:36,height:36,borderRadius:10,background:'var(--surf2)',border:'1px solid var(--border)',display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 10px'}}>
            <Ic.Flag s={16} c='var(--t3)'/>
          </div>
          Nenhuma meta ainda
        </div>
      ):(
        <>
          {pendentes.map(m=>(
            <MetaItem key={m.id} meta={m} onToggle={onToggle} onDelete={onDelete} onEdit={onEdit} onUpdateQtd={onUpdateQtd}/>
          ))}
          {concluidas.length>0&&(
            <div>
              <button onClick={()=>setShowDone(p=>!p)}
                style={{fontSize:10,color:'var(--t3)',fontWeight:600,textTransform:'uppercase',letterSpacing:'.5px',padding:'8px 0 6px',borderTop:'1px solid var(--border)',marginTop:4,width:'100%',textAlign:'left',background:'none',border:'none',borderTop:'1px solid var(--border)',cursor:'pointer',display:'flex',alignItems:'center',gap:5}}>
                {showDone?<Ic.ChevL s={10}/>:<Ic.ChevR s={10}/>}
                Concluídas ({concluidas.length})
              </button>
              {showDone&&concluidas.map(m=>(
                <MetaItem key={m.id} meta={m} onToggle={onToggle} onDelete={onDelete} onEdit={onEdit} onUpdateQtd={onUpdateQtd}/>
              ))}
            </div>
          )}
        </>
      )}
    </div>
  );
}
